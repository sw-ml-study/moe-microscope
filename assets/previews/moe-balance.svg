<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>MX01 load-balance term</title><desc>For one 28-token window the trained router's one-hot choices give a routed fraction per expert, its probabilities give a mean importance per expert, and the balance term is the number of experts times the sum of their products; it is one when both are uniform.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">MX01 LOAD BALANCE -- why no expert is allowed to take everything</text><text x="32" y="60" class="m">WHAT: balance = E x sum_e f_e x P_e, with f_e = fraction of tokens routed to e and P_e = mean router probability of e</text><text x="32" y="96" class="k">window 2+3=|5.: expert per position (first 7)</text><rect x="32" y="104" width="38" height="24" class="cell"/><text x="37" y="121" class="">3</text><rect x="72" y="104" width="38" height="24" class="cell"/><text x="77" y="121" class="">2</text><rect x="112" y="104" width="38" height="24" class="cell"/><text x="117" y="121" class="">2</text><rect x="152" y="104" width="38" height="24" class="pad"/><text x="157" y="121" class="">0</text><rect x="192" y="104" width="38" height="24" class="cell"/><text x="197" y="121" class="">3</text><rect x="232" y="104" width="38" height="24" class="cell"/><text x="237" y="121" class="">2</text><rect x="272" y="104" width="38" height="24" class="cell"/><text x="277" y="121" class="">2</text><text x="32" y="156" class="k">router probabilities at those positions [7, 4]</text><rect x="32" y="164" width="32" height="32" class="heat" fill-opacity="0.12"/><text x="35" y="185" class="s">0.03</text><rect x="66" y="164" width="32" height="32" class="heat" fill-opacity="0.2"/><text x="69" y="185" class="s">0.11</text><rect x="100" y="164" width="32" height="32" class="heat" fill-opacity="0.1"/><text x="103" y="185" class="s">0</text><rect x="134" y="164" width="32" height="32" class="heat" fill-opacity="0.88"/><text x="137" y="185" class="s">0.86</text><rect x="32" y="198" width="32" height="32" class="heat" fill-opacity="0.1"/><text x="35" y="219" class="s">0</text><rect x="66" y="198" width="32" height="32" class="heat" fill-opacity="0.23"/><text x="69" y="219" class="s">0.15</text><rect x="100" y="198" width="32" height="32" class="heat" fill-opacity="0.63"/><text x="103" y="219" class="s">0.59</text><rect x="134" y="198" width="32" height="32" class="heat" fill-opacity="0.34"/><text x="137" y="219" class="s">0.26</text><rect x="32" y="232" width="32" height="32" class="heat" fill-opacity="0.1"/><text x="35" y="253" class="s">0</text><rect x="66" y="232" width="32" height="32" class="heat" fill-opacity="0.23"/><text x="69" y="253" class="s">0.15</text><rect x="100" y="232" width="32" height="32" class="heat" fill-opacity="0.66"/><text x="103" y="253" class="s">0.62</text><rect x="134" y="232" width="32" height="32" class="heat" fill-opacity="0.31"/><text x="137" y="253" class="s">0.23</text><rect x="32" y="266" width="32" height="32" class="heat" fill-opacity="0.99"/><text x="35" y="287" class="s">0.99</text><rect x="66" y="266" width="32" height="32" class="heat" fill-opacity="0.1"/><text x="69" y="287" class="s">0</text><rect x="100" y="266" width="32" height="32" class="heat" fill-opacity="0.11"/><text x="103" y="287" class="s">0.01</text><rect x="134" y="266" width="32" height="32" class="heat" fill-opacity="0.1"/><text x="137" y="287" class="s">0</text><rect x="32" y="300" width="32" height="32" class="heat" fill-opacity="0.11"/><text x="35" y="321" class="s">0.01</text><rect x="66" y="300" width="32" height="32" class="heat" fill-opacity="0.15"/><text x="69" y="321" class="s">0.06</text><rect x="100" y="300" width="32" height="32" class="heat" fill-opacity="0.33"/><text x="103" y="321" class="s">0.26</text><rect x="134" y="300" width="32" height="32" class="heat" fill-opacity="0.7"/><text x="137" y="321" class="s">0.67</text><rect x="32" y="334" width="32" height="32" class="heat" fill-opacity="0.19"/><text x="35" y="355" class="s">0.1</text><rect x="66" y="334" width="32" height="32" class="heat" fill-opacity="0.12"/><text x="69" y="355" class="s">0.02</text><rect x="100" y="334" width="32" height="32" class="heat" fill-opacity="0.83"/><text x="103" y="355" class="s">0.82</text><rect x="134" y="334" width="32" height="32" class="heat" fill-opacity="0.15"/><text x="137" y="355" class="s">0.06</text><rect x="32" y="368" width="32" height="32" class="heat" fill-opacity="0.37"/><text x="35" y="389" class="s">0.3</text><rect x="66" y="368" width="32" height="32" class="heat" fill-opacity="0.28"/><text x="69" y="389" class="s">0.2</text><rect x="100" y="368" width="32" height="32" class="heat" fill-opacity="0.41"/><text x="103" y="389" class="s">0.35</text><rect x="134" y="368" width="32" height="32" class="heat" fill-opacity="0.24"/><text x="137" y="389" class="s">0.15</text><text x="420" y="96" class="k">per expert (all 28 positions)</text><text x="420" y="120" class="">expert            e0      e1      e2      e3</text><text x="420" y="144" class="">f_e (fraction)    0.25  0.179  0.393  0.179</text><text x="420" y="168" class="">P_e (importance)  0.226  0.238  0.292  0.244</text><text x="420" y="192" class="">f_e x P_e         0.0565  0.0425  0.1149  0.0435</text><text x="420" y="224" class="k">balance = 4 x 0.2574 = 1.03</text><text x="420" y="248" class="">uniform routing: f = P = 0.25 each, balance = 4 x 4 x 0.0625 = 1.0</text><text x="420" y="272" class="">one expert takes all: f = (1,0,0,0), P -> (1,0,0,0), balance -> 4.0</text><text x="32" y="430" class="k">training-set load after 300 epochs: 208  30  47  121</text><rect x="30" y="452" width="900" height="84" class="panel"/><text x="50" y="476" class="">WHY: f_e is a count and has no gradient; P_e is differentiable, so the term pushes probabilities away from over-used experts.</text><text x="50" y="498" class="">WHY: weight 0.01 (Switch) is enough here; the loads above stayed spread instead of collapsing onto one expert.</text><text x="50" y="520" class="m">HOW: u:balance_loss(probs, mask, E, T); T is explicit because size arithmetic is not traced (F12). Tests pin 1.0 when uniform.</text></svg>