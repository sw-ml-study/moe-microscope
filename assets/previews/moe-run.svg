<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>MX01 training run</title><desc>Training and validation loss over 300 epochs, the number of masked training tokens each of four experts receives at every checkpoint, router entropy and balance, and per-family accuracy on training and validation rows.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">MX01 RUN -- four experts learn to share the tokens</text><text x="32" y="60" class="m">WHAT: 27000 one-example Adam steps; loss = masked cross-entropy + 0.01 x balance; routing counted every 25 epochs</text><line x1="60" y1="250" x2="420" y2="250" class="axis"/><line x1="60" y1="90" x2="60" y2="250" class="axis"/><polyline points="90,211.3 120,220.8 150,210.5 180,229.5 210,229.7 240,235.2 270,239.2 300,235.6 330,238.8 360,241.5 390,244.8 420,240.8 " class="l1"/><polyline points="90,168.5 120,147.8 150,138.1 180,131.4 210,118.3 240,122.7 270,108.3 300,101.8 330,109.3 360,102.7 390,91.4 420,90 " class="l2"/><text x="60" y="82" class="k">masked loss; top = 3.764</text><text x="60" y="268" class="m">epoch 0 .. 300   gold = train, pink = validation</text><text x="60" y="300" class="k">tokens per expert over training (of 406 masked training tokens)</text><line x1="60" y1="4