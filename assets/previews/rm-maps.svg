s">prose</text><text x="720" y="280" class="s">E0      E1      E2      E3</text><text x="40" y="316" class="m">R=2 run specialization per recurrence: 0.476  0.48; MX01 (R=1) scored 0.61.</text><rect x="30" y="340" width="900" height="180" class="panel"/><text x="50" y="368" class="">WHY: if experts specialize by family at every recurrence, the mixture keeps its structure through reasoning time;</text><text x="50" y="390" class="">     if a later recurrence's map is flat, that step's routing is not about the task family.</text><text x="50" y="416" class="">HOW: family-by-expert counts per recurrence come from u:routing_stats; the specialization score is the mean over</text><text x="50" y="438" class="">     families of the largest expert share (0.25 when routing ignores the family), as in MX02.</text><text x="50" y="468" class="m">Limitation: 90 windows, one seed; the four families are separable by construction (see the MX02 report).</text></svg>