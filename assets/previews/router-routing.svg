<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>MX01 routing transformation</title><desc>Six tokens' router logits become probabilities by softmax, a one-hot mask by argmax, and a gate that keeps only the selected expert's probability; the dispatch table below counts tokens per expert.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">MX01 ROUTING -- from hidden state to expert choice</text><text x="32" y="60" class="m">WHAT: logits = h @ Wr + b -> probs = softmax(logits) -> mask = one_hot(argmax) -> gate = probs * mask, all [T=6, E=4]</text><text x="32" y="96" class="k">logits</text><rect x="32" y="104" width="50" height="24" class="cell"/><text x="36" y="120" class="s">0.57</text><rect x="84" y="104" width="50" height="24" class="cell"/><text x="88" y="120" class="s">-2.25</text><rect x="136" y="104" width="50" height="24" class="cell"/><text x="140" y="120" class="s">-0.71</text><rect x="188" y="104" width="50" height="24" class="cell"/><text x="192" y="120" class="s">-2.29</text><rect x="32" y="130" width="50" height="24" class="cell"/><text x="36" y="146" class="s">0.37</text><rect x="84" y="130" width="50" height="24" class="cell"/><text x="88" y="146" class="s">2.32</text><rect x="136" y="130" width="5