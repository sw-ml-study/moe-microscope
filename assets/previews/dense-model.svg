<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>DN01 dense model transformation</title><desc>The example 2+3=|5. flows through the embedding, positional addition, a residual attention block, a residual feed-forward block, a final norm, and the vocabulary head; each stage shows its shape and parameter count and the final row shows the argmax prediction beside the target.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">DN01 DENSE BASELINE -- one window through the model</text><text x="32" y="60" class="m">WHAT: 3812 parameters, all read for every token (dense) except the unread embedding rows</text><rect x="32" y="80" width="130" height="64" class="box"/><text x="40" y="98" class="k">ids [T]</text><text x="40" y="116" class="">52-symbol alphabet</text><text x="40" y="134" class="m">0 params</text><rect x="180" y="80" width="150" height="64" class="box"/><text x="188" y="98" class="k">embed [T,16]</text><text x="188" y="116" class="">row lookup by id</text><text x="188" y="134" class="m">832 params</text><rect x="348" y="80" width="150" height="64" class="box"/><text x="356" y="98" class="k">+ positions</text><text x="356" y="116" class="">sinusoidal, unlabeled</text><text x="356" y="134" class="m">0 params</text><rect x="516" y="80" width="200" height="64" class="box"/><text x="524" y="98" class="k">h1 = h0 + att(h0)</text><text x="524" y="116" class="">rms_norm, causal attention</text><text x="524" y="134" class="m">1024 params</text><rect x="734" y="80" width="196" height="64" class="box"/><text x="742" y="98" class="k">h2 = h1 + ffn(h1)</text><text x="742" y="116" class="">rms_norm, 16->32 relu 32->16</text><text x="742" y="134" class="m">1072 params</text><rect x="516" y="160" width="200" height="64" class="box"/><text x="524" y="178" class="k">norm + head</text><text x="524" y="196" class="">rms_norm, linear 16->52</text><text x="524" y="214" class="m">884 params</text><rect x="734" y="160" width="196" height="64" class="box"/><text x="742" y="178" class="k">logits [T,52]</text><text x="742" y="196" class="">masked cross-entropy on</text><text x="742" y="214" class="m">answer and stop targets</text><text x="32" y="258" class="k">example  2+3=|5.</text><rect x="260" y="241" width="28" height="24" class="cell"/><text x="267" y="258" class="">2</text><rect x="290" y="241" width="28" height="24" class="cell"/><text x="297" y="258" class="">+</text><rect x="320" y="241" width="28" height="24" class="cell"/><text x="327" y="258" class="">3</text><rect x="350" y="241" width="28" height="24" class="cell"/><text x="357" y="258" class="">=</text><rect x="380" y="241" width="28" height="24" class="cell"/><text x="387" y="258" class="">|</text><rect x="410" y="241" width="28" height="24" class="cell"/><text x="417" y="258" class="">5</text><rect x="440" y="241" width="28" height="24" class="cell"/><text x="447" y="258" class="">.</text><text x="32" y="298" class="k">ids</text><rect x="260" y="281" width="28" height="24" class="cell"/><text x="265" y="298" class="">4</text><rect x="290" y="281" width="28" height="24" class="cell"/><text x="295" y="298" class="">12</text><rect x="320" y="281" width="28" height="24" class="cell"/><text x="325" y="298" class="">5</text><rect x="350" y="281" width="28" height="24" class="cell"/><text x="355" y="298" class="">15</text><rect x="380" y="281" width="28" height="24" class="cell"/><text x="385" y="298" class="">50</text><rect x="410" y="281" width="28" height="24" class="cell"/><text x="415" y="298" class="">7</text><rect x="440" y="281" width="28" height="24" class="cell"/><text x="445" y="298" class="">51</text><text x="32" y="338" class="k">argmax prediction</text><rect x="260" y="321" width="28" height="24" class="cell"/><text x="267" y="338" class="">4</text><rect x="290" y="321" width="28" height="24" class="cell"/><text x="297" y="338" class="">8</text><rect x="320" y="321" width="28" height="24" class="cell"/><text x="327" y="338" class="">6</text><rect x="350" y="321" width="28" height="24" class="cell"/><text x="357" y="338" class="">.</text><rect x="380" y="321" width="28" height="24" class="cell"/><text x="387" y="338" class="">1</text><rect x="410" y="321" width="28" height="24" class="cell"/><text x="417" y="338" class="">6</text><rect x="440" y="321" width="28" height="24" class="cell"/><text x="447" y="338" class="">6</text><text x="32" y="378" class="k">target (next char)</text><rect x="260" y="361" width="28" height="24" class="cell"/><text x="267" y="378" class="">+</text><rect x="290" y="361" width="28" height="24" class="cell"/><text x="297" y="378" class="">3</text><rect x="320" y="361" width="28" height="24" class="cell"/><text x="327" y="378" class="">=</text><rect x="350" y="361" width="28" height="24" class="cell"/><text x="357" y="378" class="">|</text><rect x="380" y="361" width="28" height="24" class="cell"/><text x="387" y="378" class="">5</text><rect x="410" y="361" width="28" height="24" class="cell"/><text x="417" y="378" class="">.</text><rect x="440" y="361" width="28" height="24" class="cell"/><text x="447" y="378" class="">~</text><rect x="30" y="400" width="900" height="120" class="panel"/><text x="50" y="428" class="">WHY: a dense block spends every parameter on every token; it is the reference that MoE, recurrence, and Engram must beat.</text><text x="50" y="453" class="">WHY: the residual is written by hand (h1 = h0 + att(h0)) so attention_weights can still reach the attention sub-model (F13).</text><text x="50" y="478" class="">HOW: u:body applies the att, ffn, norm, head globals; u:masked_ce scores answer and stop targets; adam updates all five.</text><text x="50" y="503" class="m">Prediction cells are teacher-forced: each position sees the true prefix; only positions after the bar are scored.</text></svg>