<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>SD01 dispatch and combine</title><desc>For the padded window 2+3=|5. the top-1 mask sends each of 28 tokens to one of four experts; each expert runs once on its sub-batch, the outputs are scaled by the gate and scattered back with a one-hot selection matrix, and the sum equals the dense-masked output exactly while evaluating 28 rows instead of 112.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">SD01 DISPATCH -- run each expert once on its own tokens</text><text x="32" y="60" class="m">WHAT: mask [T,E] -> per-expert rows via compress -> expert(rows) x gate -> place back via one_hot(positions)^T @ rows -> sum</text><text x="32" y="96" class="k">dispatch table, 2+3=|5. (7 rows)</text><rect x="32" y="104" width="42" height="24" class="on"/><text x="36" y="120" class="s">1</text><rect x="76" y="104" width="42" height="24" class="cell"/><text x="80" y="120" class="s">0</text><rect x="120" y="104" width="42" height="24" class="cell"/><text x="124" y="120" class="s">0</text><rect x="164" y="104" width="42" height="24" class="cell"/><text x="168" y="120" class="s">0</text><rect x="32" y="130" width="42" height="24" class="on"/><text x="36" y="146" class="s">1</text><rect x="76" y="130" width="42" height="24" class="cell"/><text x="80" y="146" class="s">0</text><rect x="120" y="130" width="42" height="24" class="cell"/><text x="124" y="146" class="s">0</text><rect x="164" y="130" width="42" height="24" class="cell"/><text x="168" y="146" class="s">0</text><rect x="32" y="156" width="42" height="24" class="cell"/><text x="36" y="172" class="s">0</text><rect x="76" y="156" width="42" height="24" class="on"/><text x="80" y="172" class="s">1</text><rect x="120" y="156" width="42" height="24" class="cell"/><text x="124" y="172" class="s">0</text><rect x="164" y="156" width="42" height="24" class="cell"/><text x="168" y="172" class="s">0</text><rect x="32" y="182" width="42" height="24" class="cell"/><text x="36" y="198" class="s">0</text><rect x="76" y="182" width="42" height="24" class="on"/><text x="80" y="198" class="s">1</text><rect x="120" y="182" width="42" height="24" class="cell"/><text x="124" y="198" class="s">0</text><rect x="164" y="182" width="42" height="24" class="cell"/><text x="168" y="198" class="s">0</text><rect x="32" y="208" width="42" height="24" class="cell"/><text x="36" y="224" class="s">0</text><rect x="76" y="208" width="42" height="24" class="on"/><text x="80" y="224" class="s">1</text><rect x="120" y="208" width="42" height="24" class="cell"/><text x="124" y="224" class="s">0</text><rect x="164" y="208" width="42" height="24" class="cell"/><text x="168" y="224" class="s">0</text><rect x="32" y="234" width="42" height="24" class="on"/><text x="36" y="250" class="s">1</text><rect x="76" y="234" width="42" height="24" class="cell"/><text x="80" y="250" class="s">0</text><rect x="120" y="234" width="42" height="24" class="cell"/><text x="124" y="250" class="s">0</text><rect x="164" y="234" width="42" height="24" class="cell"/><text x="168" y="250" class="s">0</text><rect x="32" y="260" width="42" height="24" class="on"/><text x="36" y="276" class="s">1</text><rect x="76" y="260" width="42" height="24" class="cell"/><text x="80" y="276" class="s">0</text><rect x="120" y="260" width="42" height="24" class="cell"/><text x="124" y="276" class="s">0</text><rect x="164" y="260" width="42" height="24" class="cell"/><text x="168" y="276" class="s">0</text><text x="330" y="96" class="k">rows per expert (all 28 positions)</text><rect x="330" y="104" width="42" height="24" class="cell"/><text x="335" y="121" class="">17</text><rect x="374" y="104" width="42" height="24" class="cell"/><text x="379" y="121" class="">8</text><rect x="418" y="104" width="42" height="24" class="pad"/><text x="423" y="121" class="">0</text><rect x="462" y="104" width="42" height="24" class="cell"/><text x="467" y="121" class="">3</text><text x="290" y="156" class="k">dense-masked: 4 experts x 28 rows = 112 row evaluations</text><text x="290" y="178" class="k">sparse: 17  8  0  3 = 28 row evaluations</text><text x="290" y="210" class="">parameters touched per token: dense 6280, sparse 3064</text><text x="290" y="232" class="">over 120 windows: 13440 vs 3360 row evaluations</text><text x="290" y="254" class="">max |dense - sparse| output difference: 0</text><text x="290" y="276" class="">interpreter timing lives in the results row, not here: it varies per run</text><text x="32" y="320" class="k">sparse mixture output, first 4 positions x first 6 dims (equals the dense-masked output)</text><rect x="32" y="328" width="58" height="24" class="cell"/><text x="36" y="344" class="s">2.012</text><rect x="92" y="328" width="58" height="24" class="cell"/><text x="96" y="344" class="s">1.227</text><rect x="152" y="328" width="58" height="24" class="cell"/><text x="156" y="344" class="s">-4.884</text><rect x="212" y="328" width="58" height="24" class="cell"/><text x="216" y="344" class="s">10.044</text><rect x="272" y="328" width="58" height="24" class="cell"/><text x="276" y="344" class="s">0.009</text><rect x="332" y="328" width="58" height="24" class="cell"/><text x="336" y="344" class="s">-0.608</text><rect x="32" y="354" width="58" height="24" class="cell"/><text x="36" y="370" class="s">0.775</text><rect x="92" y="354" width="58" height="24" class="cell"/><text x="96" y="370" class="s">-0.709</text><rect x="152" y="354" width="58" height="24" class="cell"/><text x="156" y="370" class="s">1.385</text><rect x="212" y="354" width="58" height="24" class="cell"/><text x="216" y="370" class="s">2.509</text><rect x="272" y="354" width="58" height="24" class="cell"/><text x="276" y="370" class="s">-0.364</text><rect x="332" y="354" width="58" height="24" class="cell"/><text x="336" y="370" class="s">-0.766</text><rect x="32" y="380" width="58" height="24" class="cell"/><text x="36" y="396" class="s">1.118</text><rect x="92" y="380" width="58" height="24" class="cell"/><text x="96" y="396" class="s">-0.716</text><rect x="152" y="380" width="58" height="24" class="cell"/><text x="156" y="396" class="s">3.745</text><rect x="212" y="380" width="58" height="24" class="cell"/><text x="216" y="396" class="s">2.628</text><rect x="272" y="380" width="58" height="24" class="cell"/><text x="276" y="396" class="s">1.431</text><rect x="332" y="380" width="58" height="24" class="cell"/><text x="336" y="396" class="s">1.437</text><rect x="32" y="406" width="58" height="24" class="cell"/><text x="36" y="422" class="s">1.266</text><rect x="92" y="406" width="58" height="24" class="cell"/><text x="96" y="422" class="s">-0.62</text><rect x="152" y="406" width="58" height="24" class="cell"/><text x="156" y="422" class="s">3.339</text><rect x="212" y="406" width="58" height="24" class="cell"/><text x="216" y="422" class="s">2.73</text><rect x="272" y="406" width="58" height="24" class="cell"/><text x="276" y="422" class="s">1.739</text><rect x="332" y="406" width="58" height="24" class="cell"/><text x="336" y="422" class="s">1.714</text><text x="420" y="340" class="">an idle expert (0 rows) is skipped entirely;</text><text x="420" y="360" class="">a loaded expert runs one matmul over its rows,</text><text x="420" y="380" class="">so work follows the routing, not the expert count.</text><rect x="30" y="452" width="900" height="84" class="panel"/><text x="50" y="476" class="">WHY: this is where MoE saves compute: dense-masked evaluates every expert; dispatch evaluates only the routed one.</text><text x="50" y="498" class="">WHY: exact parity proves the two paths are one model; training stays dense-masked, inference dispatches.</text><text x="50" y="520" class="m">HOW: u:dispatch_rows (compress), u:dispatch_gate, u:place_rows (selection matmul); gather overhead beats a 16x32 matmul here.</text></svg>