<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>MX02 top-1 versus top-2</title><desc>Top-2 routing doubles the expert parameters touched per token; the table compares MX01 and MX02 on active parameters, expert evaluations, validation loss, per-family validation accuracy, router entropy, balance, and specialization.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">MX02 COST -- is the second expert worth doubling active compute?</text><text x="32" y="60" class="m">WHAT: the same 7,096-parameter model with k = 1 (MX01) and k = 2 (MX02); everything else identical</text><text x="300" y="96" class="k">MX01 top-1</text><text x="520" y="96" class="k">MX02 top-2</text><text x="32" y="122" class="">active params / token</text><text x="300" y="122" class="">3064</text><text x="520" y="122" class="">4136</text><text x="32" y="144" class="">expert evals / token</text><text x="300" y="144" class="">1</text><text x="520" y="144" class="">2</text><text x="32" y="166" class="">bytes / token (f64)</text><text x="300" y="166" class="">24512</text><text x="520" y="166" class="">33088</text><text x="32" y="188" class="">validation loss</text><text x="300" y="188" class="">3.7641</text><text x="520" y="188" class="">3.9157</text><text x="32" y="210" class="">val acc arith seq mlpl prose</text><text x="300" y="210" class="">0  0  0  0.67</text><text x="520" y="210" class="">0  0  0.29  0</text><text x="32" y="232" class="">train exact match</text><text x="300" y="232" class="">0.622</text><text x="520" y="232" class="">0.856</text><text x="32" y="254" class="">router entropy (nats)</text><text x="300" y="254" class="">0.623</text><text x="520" y="254" class="">0.506</text><text x="32" y="276" class="">balance (1.0 = even)</text><text x="300" y="276" class="">1.166</text><text x="520" y="276" class="">0.53</text><text x="32" y="298" class="">specialization score</text><text x="300" y="298" class="">0.61</text><text x="520" y="298" class="">0.42</text><text x="32" y="340" class="k">routing of 2+3=|5. under top-2 (first 4 positions; two experts per row)</text><rect x="32" y="348" width="42" height="24" class="cell"/><text x="36" y="364" class="s">0</text><rect x="76" y="348" width="42" height="24" class="on"/><text x="80" y="364" class="s">1</text><rect x="120" y="348" width="42" height="24" class="cell"/><text x="124" y="364" class="s">0</text><rect x="164" y="348" width="42" height="24" class="on"/><text x="168" y="364" class="s">1</text><rect x="32" y="374" width="42" height="24" class="on"/><text x="36" y="390" class="s">1</text><rect x="76" y="374" width="42" height="24" class="cell"/><text x="80" y="390" class="s">0</text><rect x="120" y="374" width="42" height="24" class="cell"/><text x="124" y="390" class="s">0</text><rect x="164" y="374" width="42" height="24" class="on"/><text x="168" y="390" class="s">1</text><rect x="32" y="400" width="42" height="24" class="cell"/><text x="36" y="416" class="s">0</text><rect x="76" y="400" width="42" height="24" class="on"/><text x="80" y="416" class="s">1</text><rect x="120" y="400" width="42" height="24" class="cell"/><text x="124" y="416" class="s">0</text><rect x="164" y="400" width="42" height="24" class="on"/><text x="168" y="416" class="s">1</text><rect x="32" y="426" width="42" height="24" class="on"/><text x="36" y="442" class="s">1</text><rect x="76" y="426" width="42" height="24" class="cell"/><text x="80" y="442" class="s">0</text><rect x="120" y="426" width="42" height="24" class="cell"/><text x="124" y="442" class="s">0</text><rect x="164" y="426" width="42" height="24" class="on"/><text x="168" y="442" class="s">1</text><text x="240" y="372" class="">each row selects two of four experts;</text><text x="240" y="392" class="">their gates are renormalized to sum to one.</text><rect x="30" y="466" width="900" height="70" class="panel"/><text x="50" y="488" class="">WHY: top-2 buys a differentiable gate and a second opinion per token at twice the expert cost; the table shows the price.</text><text x="50" y="508" class="">HOW: u:top2_mask (two argmax passes, constants on the tape); u:top2_gate renormalized by a ones matmul; balance over 2T.</text><text x="50" y="528" class="m">Bytes assume f64 weights; quantization lessons shrink them, cache lessons decide which are resident.</text></svg>