<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>EG01 table-size sweep</title><desc>Four from-scratch runs at 1,024, 256, 64, and 16 slots per order: collisions and rows addressed, the final gate mean, validation loss, and prose held-out accuracy, with the dense baseline for reference.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">TABLE-SIZE SWEEP -- what shrinking the table costs</text><text x="32" y="60" class="m">WHAT: one process per size (finding F22); x is the slot count per order, log spaced; DN01 (no table) dashed.</text><text x="60" y="92" class="k">collisions (of the distinct contexts) and rows addressed</text><polyline points="80,105 180,120 280,156.8 380,194.9 " class="l2"/><rect x="77" y="101.99349804941482" width="6" height="6" class="l2"/><rect x="177" y="116.97399219765929" width="6" height="6" class="l2"/><rect x="277" y="153.80104031209362" width="6" height="6" class="l2"/><rect x="377" y="191.87646293888167" width="6" height="6" class="l2"/><polyline points="80,215 180,204.4 280,195.5 380,191 " class="l1"/><rect x="77" y="212.00650195058518" width="6" height="6" class="l1"/><rect x="177" y="201.39531859557866" width="6" height="6" class="l1"/><rect x="277" y="192.5006501950585" width="6" height="6" class="l1"/><rect x="377" y="187.97529258777632" width="6" height="6" class="l1"/><text x="60" y="240" class="m">pink = collisions, gold = nonzero rows; top of axis = 769 distinct contexts</text><text x="60" y="258" class="m">slots per order:   16        64       256      1024</text><text x="480" y="92" class="k">validation loss (top 5.0), DN01 dashed at 3.789</text><polyline points="500,117.6 600,112.2 700,108 800,125.6 " class="l2"/><rect x="497" y="114.63838218659153" width="6" height="6" class="l2"/><rect x="597" y="109.20632457245252" width="6" height="6" class="l2"/><rect x="697" y="105.03233513287876" width="6" height="6" class="l2"/><rect x="797" y="122.62531388688429" width="6" height="6" class="l2"/><line x1="500" y1="129.1" x2="800" y2="129.1" class="axis" stroke-dasharray="4 4"/><text x="480" y="258" class="m">slots per order:   16        64       256      1024</text><text x="60" y="292" class="k">final gate mean (top of axis 1.0)</text><polyline points="80,339.6 180,329.3 280,324.3 380,321 " class="l1"/><rect x="77" y="336.62096960787767" width="6" height="6" class="l1"/><rect x="177" y="326.3389000744559" width="6" height="6" class="l1"/><rect x="277" y="321.2697802810893" width="6" height="6" class="l1"/><rect x="377" y="318.0459954305187" width="6" height="6" class="l1"/><text x="480" y="292" class="k">prose held-out exact match (top 1.0), DN01 dashed at 0.667</text><polyline points="500,380 600,380 700,380 800,326.7 " class="l1"/><rect x="497" y="377" width="6" height="6" class="l1"/><rect x="597" y="377" width="6" height="6" class="l1"/><rect x="697" y="377" width="6" height="6" class="l1"/><rect x="797" y="323.6666666666667" width="6" height="6" class="l1"/><line x1="500" y1="326.6" x2="800" y2="326.6" class="axis" stroke-dasharray="4 4"/><text x="60" y="404" class="">slots 16: val 4.265  prose 0  gate 0.505  collisions 737  rows 32</text><text x="60" y="422" class="">slots 64: val 4.491  prose 0  gate 0.633  collisions 641  rows 100</text><text x="60" y="440" class="">slots 256: val 4.665  prose 0  gate 0.697  collisions 405  rows 157</text><text x="60" y="458" class="">slots 1024: val 3.932  prose 0.667  gate 0.737  collisions 161  rows 186</text><rect x="30" y="472" width="900" height="56" class="panel"/><text x="50" y="494" class="">WHY: collisions rise as the table shrinks and contexts must share rows; the question is where quality follows.</text><text x="50" y="514" class="m">HOW: collisions are distinct contexts minus distinct rows per order (u:engram_collisions, equal to engram_stats).</text></svg>