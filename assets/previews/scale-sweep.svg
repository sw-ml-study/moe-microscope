<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>DS01 data scale</title><desc>Validation masked loss falls as the number of training examples grows from 120 to 480 to 960 for both the dense model and the top-1 mixture, while doubling the epochs at 120 examples does not help; held-out accuracy per family rises with data and the training cost grows linearly.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">DS01 DATA SCALE -- data moves the held-out columns, epochs do not</text><text x="32" y="60" class="m">WHAT: DN01 (gold) and MX01 (pink) at 120, 480, and 960 examples for 200 epochs; hollow marks: 120 examples, 400 epochs</text><line x1="70" y1="270" x2="420" y2="270" class="axis"/><line x1="70" y1="96" x2="70" y2="270" class="axis"/><text x="70" y="88" class="k">validation masked loss; top = 4.17</text><polyline points="111.3,128.1 235,202.5 400,224.8 " class="l1"/><polyline points="111.3,127.9 235,212.2 400,220.2 " class="l2"/><rect x="107.25" y="107.59697191880323" width="8" height="8" class="cell"/><rect x="115.25" y="96" width="8" height="8" class="cell"/><text x="99.25" y="288" class="s">120</text><text x="97.25" y="120.14777708275003" class="s">3.48</text><text x="97.25" y="143.93198607615608" class="s">3.49</text><text x="223" y="288" class="s">480</text><text x="221" y="194.54079887499148" class="s">1.66</text><text x="221" y="228.2406962783494" class="s">1.42</text><text x="388" y="288" class="s">960</text><text x="386" y="216.80171790027674" class="s">1.11</text><text x="386" y="236.18147947933622" class="s">1.22</text><text x="70" y="306" class="m">examples; hollow marks at 400 epochs: 3.89 and 4.17</text><text x="70" y="326" class="m">three quarters of the examples are training rows</text><text x="480" y="88" class="k">held-out accuracy per family (arith, seq, mlpl, prose) by size</text><text x="480" y="112" class="s">dense 120</text><rect x="480" y="198" width="18" height="1" class="l1"/><rect x="502" y="198" width="18" height="1" class="l1"/><rect x="524" y="198" width="18" height="1" class="l1"/><rect x="546" y="145" width="18" height="54" class="l1"/><text x="580" y="112" class="s">dense 480</text><rect x="580" y="191" width="18" height="8" class="l1"/><rect x="602" y="196" width="18" height="3" class="l1"/><rect x="624" y="192" width="18" height="7" class="l1"/><rect x="646" y="118" width="18" height="81" class="l1"/><text x="680" y="112" class="s">dense 960</text><rect x="680" y="182" width="18" height="17" class="l1"/><rect x="702" y="190" width="18" height="9" class="l1"/><rect x="724" y="192" width="18" height="7" class="l1"/><rect x="746" y="118" width="18" height="81" class="l1"/><text x="480" y="222" class="s">moe 120</text><rect x="480" y="308" width="18" height="1" class="l2"/><rect x="502" y="299" width="18" height="10" class="l2"/><rect x="524" y="308" width="18" height="1" class="l2"/><rect x="546" y="255" width="18" height="54" class="l2"/><text x="580" y="222" class="s">moe 480</text><rect x="580" y="301" width="18" height="8" class="l2"/><rect x="602" y="303" width="18" height="6" class="l2"/><rect x="624" y="302" width="18" height="7" class="l2"/><rect x="646" y="228" width="18" height="81" class="l2"/><text x="680" y="222" class="s">moe 960</text><rect x="680" y="301" width="18" height="8" class="l2"/><rect x="702" y="306" width="18" height="3" class="l2"/><rect x="724" y="302" width="18" height="7" class="l2"/><rect x="746" y="248" width="18" height="61" class="l2"/><text x="790" y="140" class="">bar height = accuracy,</text><text x="790" y="158" class="">full height = 1.0</text><text x="480" y="330" class="k">overall held-out accuracy</text><text x="480" y="352" class="">dense  0.067  0.175  0.2</text><text x="480" y="372" class="">moe    0.1  0.183  0.121</text><text x="480" y="400" class="k">training seconds per run (this machine)</text><text x="480" y="422" class="">dense  12  52  97</text><text x="480" y="442" class="">moe    27  94  190</text><rect x="30" y="462" width="900" height="74" class="panel"/><text x="50" y="486" class="">WHY: at 120 examples both models memorize; doubling epochs moves the training column and worsens the held-out loss.</text><text x="50" y="506" class="">WHY: more examples of the same families teach rules instead of rows; the cost grows linearly with examples times epochs.</text><text x="50" y="526" class="m">HOW: demos/scale_train.mlpl per point; scripts/run-scale-sweep write is opt-in (minutes); redrawn from fixtures/scale.</text></svg>