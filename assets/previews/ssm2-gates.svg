"278" class="">=</text><text x="191" y="296" class="s">0.82</text><rect x="220" y="262" width="28" height="22" class="heat" fill-opacity="0.87"/><text x="225" y="278" class="">|</text><text x="221" y="296" class="s">0.87</text><rect x="250" y="262" width="28" height="22" class="heat" fill-opacity="0.84"/><text x="255" y="278" class="">4</text><text x="251" y="296" class="s">0.83</text><rect x="280" y="262" width="28" height="22" class="heat" fill-opacity="0.79"/><text x="285" y="278" class="">2</text><text x="281" y="296" class="s">0.78</text><rect x="310" y="262" width="28" height="22" class="heat" fill-opacity="0.86"/><text x="315" y="278" class="">.</text><text x="311" y="296" class="s">0.85</text><text x="40" y="332" class="k">SS02m matched, state 16: prose   mean 0.82</text><rect x="40" y="342" width="28" height="22" class="heat" fill-opacity="0.82"/><text x="45" y="358" class="">t</text><text x="41" y="376" class="s">0.81</text><rect x="70" y="342" width="28" height="22" class="heat" fill-opacity="0.84"/><text x="75" y="358" class="">h</text><text x="71" y="376" class="s">0.83</text><rect x="100" y="342" width="28" height="22" class="heat" fill-opacity="0.83"/><text x="105" y="358" class="">e</text><text x="101" y="376" class="s">0.82</text><rect x="130" y="342" width="28" height="22" class="heat" fill-opacity="0.86"/><text x="135" y="358" class=""> </text><text x="131" y="376" class="s">0.85</text><rect x="160" y="342" width="28" height="22" class="heat" fill-opacity="0.81"/><text x="165" y="358" class="">c</text><text x="161" y="376" class="s">0.8</text><rect x="190" y="342" width="28" height="22" class="heat" fill-opacity="0.8"/><text x="195" y="358" class="">a</text><text x="191" y="376" class="s">0.79</text><rect x="220" y="342" width="28" height="22" class="heat" fill-opacity="0.81"/><text x="225" y="358" class="">t</text><text x="221" y="376" class="s">0.8</text><rect x="250" y="342" width="28" height="22" class="heat" fill-opacity="0.88"/><text x="255" y="358" class=""> </text><text x="251" y="376" class="s">0.87</text><rect x="280" y="342" width="28" height="22" class="heat" fill-opacity="0.91"/><text x="285" y="358" class="">s</text><text x="281" y="376" class="s">0.91</text><rect x="310" y="342" width="28" height="22" class="heat" fill-opacity="0.81"/><text x="315" y="358" class="">a</text><text x="311" y="376" class="s">0.8</text><rect x="340" y="342" width="28" height="22" class="heat" fill-opacity="0.76"/><text x="345" y="358" class="">t</text><text x="341" y="376" class="s">0.75</text><rect x="370" y="342" width="28" height="22" class="heat" fill-opacity="0.87"/><text x="375" y="358" class=""> </text><text x="371" y="376" class="s">0.87</text><rect x="400" y="342" width="28" height="22" class="heat" fill-opacity="0.87"/><text x="405" y="358" class="">o</text><text x="401" y="376" class="s">0.87</text><rect x="430" y="342" width="28" height="22" class="heat" fill-opacity="0.91"/><text x="435" y="358" class="">n</text><text x="431" y="376" class="s">0.91</text><rect x="460" y="342" width="28" height="22" class="heat" fill-opacity="0.88"/><text x="465" y="358" class=""> </text><text x="461" y="376" class="s">0.88</text><rect x="490" y="342" width="28" height="22" class="heat" fill-opacity="0.8"/><text x="495" y="358" class="">t</text><text x="491" y="376" class="s">0.79</text><rect x="520" y="342" width="28" height="22" class="heat" fill-opacity="0.76"/><text x="525" y="358" class="">h</text><text x="521" y="376" class="s">0.75</text><rect x="550" y="342" width="28" height="22" class="heat" fill-opacity="0.85"/><text x="555" y="358" class="">e</text><text x="551" y="376" class="s">0.84</text><rect x="580" y="342" width="28" height="22" class="heat" fill-opacity="0.86"/><text x="585" y="358" class=""> </text><text x="581" y="376" class="s">0.86</text><rect x="610" y="342" width="28" height="22" class="heat" fill-opacity="0.86"/><text x="615" y="358" class="">|</text><text x="611" y="376" class="s">0.85</text><rect x="640" y="342" width="28" height="22" class="heat" fill-opacity="0.76"/><text x="645" y="358" class="">m</text><text x="641" y="376" class="s">0.75</text><rect x="670" y="342" width="28" height="22" class="heat" fill-opacity="0.8"/><text x="675" y="358" class="">a</text><text x="671" y="376" class="s">0.78</text><rect x="700" y="342" width="28" height="22" class="heat" fill-opacity="0.71"/><text x="705" y="358" class="">t</text><text x="701" y="376" class="s">0.69</text><rect x="730" y="342" width="28" height="22" class="heat" fill-opacity="0.86"/><text x="735" y="358" class="">.</text><text x="731" y="376" class="s">0.85</text><rect x="30" y="400" width="900" height="124" class="panel"/><text x="50" y="426" class="">WHY: a fixed decay (SS01) forgets on a schedule; a selective decay can hold the state through one token and drop it at</text><text x="50" y="448" class="">     the next, which is what a sequence model needs at a boundary such as the bar before the answer.</text><text x="50" y="474" class="">HOW: u:ssm_sel_decay is sigmoid(x Wa + b); the bias gives the decay a baseline, so Wa = 0 reproduces SS01 exactly and the</text><text x="50" y="496" class="">     selective block contains the fixed one as a special case. Without it the decay starts at 0.5 and halves the state each token.</text><text x="50" y="518" class="m">READ: the range within a window, not the mean, is the selectivity; a flat strip is a fixed decay wearing a gate.</text></svg>