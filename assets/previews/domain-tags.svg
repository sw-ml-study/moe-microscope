<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>Task tag data structure</title><desc>Eight generated examples listed with their task family tag, beside bars showing the fixed mixture ratios of the 120-example fixture.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">TASK TAGS -- which family each example belongs to</text><text x="32" y="60" class="m">WHAT: tags:[N] holds 0 arithmetic, 1 sequence, 2 mlpl, 3 prose; texts:[N] are the prompt|answer. strings</text><rect x="32" y="80" width="110" height="24" class="t0"/><text x="40" y="97" class="">0 arithmetic</text><rect x="150" y="80" width="380" height="24" class="cell"/><text x="158" y="97" class="">89+74=|163.</text><rect x="32" y="110" width="110" height="24" class="t0"/><text x="40" y="127" class="">0 arithmetic</text><rect x="150" y="110" width="380" height="24" class="cell"/><text x="158" y="127" class="">61+5=|66.</text><rect x="32" y="140" width="110" height="24" class="t0"/><text x="40" y="157" class="">0 arithmetic</text><rect x="150" y="140" width="380" height="24" class="cell"/><text x="158" y="157" class="">22+39=|61.</text><rect x="32" y="170" width="110" height="24" class="t1"/><text x="40" y="187" class="">1 sequence</text><rect x="150" y="170" width="380" height="24" class="cell"/><text x="158" y="187" class="">sort 6 4 2 7=|2 4 6 7.</text><rect x="32" y="200" width="110" height="24" class="t1"/><text x="40" y="217" class="">1 sequence</text><rect x="150" y="200" width="380" height="24" class="cell"/><text x="158" y="217" class="">rev 3 5 7 2 7=|7 2 7 5 3.</text><rect x="32" y="230" width="110" height="24" class="t2"/><text x="40" y="247" class="">2 mlpl</text><rect x="150" y="230" width="380" height="24" class="cell"/><text x="158" y="247" class="">reduce_mul([3,8,1])=|24.</text><rect x="32" y="260" width="110" height="24" class="t2"/><text x="40" y="277" class="">2 mlpl</text><rect x="150" y="260" width="380" height="24" class="cell"/><text x="158" y="277" class="">reduce_add([7,2,3])=|12.</text><rect x="32" y="290" width="110" height="24" class="t3"/><text x="40" y="307" class="">3 prose</text><rect x="150" y="290" width="380" height="24" class="cell"/><text x="158" y="307" class="">the bird ran on the |nest.</text><text x="570" y="97" class="k">mixture-v0.json, 120 examples</text><rect x="570" y="110" width="280" height="24" class="t0"/><text x="578" y="127" class="">arithmetic 35% = 42 examples</text><rect x="570" y="150" width="240" height="24" class="t1"/><text x="578" y="167" class="">sequence 30% = 36 examples</text><rect x="570" y="190" width="200" height="24" class="t2"/><text x="578" y="207" class="">mlpl 25% = 30 examples</text><rect x="570" y="230" width="80" height="24" class="t3"/><text x="578" y="247" class="">prose 10% = 12 examples</text><rect x="30" y="340" width="900" height="180" class="panel"/><text x="50" y="370" class="">WHY: expert specialization is only observable when examples carry a family label; accuracy is scored per family.</text><text x="50" y="395" class="">WHY: the ratios are a fixture, not a hidden constant; prose is smallest so exactly scored families dominate.</text><text x="50" y="425" class="">HOW: u:domain_counts rounds ratio * total per family, the last family absorbs rounding; u:domain_build makes</text><text x="50" y="450" class="">     count examples per family from seed * 100000 + tag * 10000 + j, so each example is reproducible from tag and j.</text><text x="50" y="480" class="m">Answers come from oracles: interpreter arithmetic, gather_rows reorderings, the named builtin, a fixed animal-to-place table.</text></svg>