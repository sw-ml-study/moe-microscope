<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>RE01 ablation matrix</title><desc>Seven models from the research's ablation: dense, recurrent, Engram, mixture of experts, recurrent mixture, mixture plus Engram, and recurrent mixture plus Engram, each with stored and active parameters, bytes per token, validation loss, held-out accuracy by family, router entropy, specialization, and Engram gate mean, read from the committed results table.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">ABLATION -- the three sparsities alone and together</text><text x="32" y="60" class="m">WHAT: every cell is a committed results row (120 examples, 300 epochs, one seed); ms per token is in the table only.</text><text x="40" y="92" class="k">model</text><text x="300" y="92" class="k">params</text><text x="370" y="92" class="k">active</text><text x="440" y="92" class="k">bytes/tok</text><text x="520" y="92" class="k">val loss</text><text x="590" y="92" class="k">prose</text><text x="650" y="92" class="k">mlpl</text><text x="710" y="92" class="k">entropy</text><text x="780" y="92" class="k">special.</text><text x="850" y="92" class="k">gate</text><rect x="32" y="102" width="900" height="24" class="cell"/><text x="40" y="118" class="">dense (DN01)</text><text x="300" y="118" class="">3812</text><text x="370" y="118" class="">2996</text><text x="440" y="118" class="">23968</text><text x="520" y="118" class="">3.79</text><text x="590" y="118" class="">0.667</text><text x="650" y="118" class="">0</text><text x="710" y="118" class="">-</text><text x="780" y="118" class="">-</text><text x="850" y="118" class="">-</text><rect x="32" y="128" width="900" height="24" class="cell"/><text x="40" y="144" class="">recurrent R=3 (RC01)</text><text x="300" y="144" class="">3812</text><text x="370" y="144" class="">7188</text><text x="440" y="144" class="">57504</text><text x="520" y="144" class="">3.73</text><text x="590" y="144" class="">0.667</text><text x="650" y="144" class="">0.286</text><text x="710" y="144" class="">-</text><text x="780" y="144" class="">-</text><text x="850" y="144" class="">-</text><rect x="32" y="154" width="900" height="24" class="cell"/><text x="40" y="170" class="">Engram 256 (EG01)</text><text x="300" y="170" class="">8708</text><text x="370" y="170" class="">3812</text><text x="440" y="170" class="">30496</text><text x="520" y="170" class="">4.67</text><text x="590" y="170" class="">0</text><text x="650" y="170" class="">0</text><text x="710" y="170" class="">-</text><text x="780" y="170" class="">-</text><text x="850" y="170" class="">0.697</text><rect x="32" y="180" width="900" height="24" class="cell"/><text x="40" y="196" class="">MoE top-1 of 4 (MX01)</text><text x="300" y="196" class="">7096</text><text x="370" y="196" class="">3064</text><text x="440" y="196" class="">24512</text><text x="520" y="196" class="">3.76</text><text x="590" y="196" class="">0.667</text><text x="650" y="196" class="">0</text><text x="710" y="196" class="">0.623</text><text x="780" y="196" class="">-</text><text x="850" y="196" class="">-</text><rect x="32" y="206" width="900" height="24" class="on"/><text x="40" y="222" class="">recurrent MoE R=3 (RM01)</text><text x="300" y="222" class="">7096</text><text x="370" y="222" class="">7392</text><text x="440" y="222" class="">59136</text><text x="520" y="222" class="">3.42</text><text x="590" y="222" class="">0.667</text><text x="650" y="222" class="">0.286</text><text x="710" y="222" class="">0.808</text><text x="780" y="222" class="">0.532</text><text x="850" y="222" class="">-</text><rect x="32" y="232" width="900" height="24" class="cell"/><text x="40" y="248" class="">MoE + Engram (ME01)</text><text x="300" y="248" class="">11992</text><text x="370" y="248" class="">3880</text><text x="440" y="248" class="">31040</text><text x="520" y="248" class="">4.6</text><text x="590" y="248" class="">0.333</text><text x="650" y="248" class="">0</text><text x="710" y="248" class="">0.687</text><text x="780" y="248" class="">0.615</text><text x="850" y="248" class="">0.671</text><rect x="32" y="258" width="900" height="24" class="cell"/><text x="40" y="274" class="">recurrent MoE + Engram (RE01)</text><text x="300" y="274" class="">11992</text><text x="370" y="274" class="">9840</text><text x="440" y="274" class="">78720</text><text x="520" y="274" class="">4.76</text><text x="590" y="274" class="">0</text><text x="650" y="274" class="">0.286</text><text x="710" y="274" class="">0.815</text><text x="780" y="274" class="">0.423</text><text x="850" y="274" class="">0.741</text><text x="32" y="318" class="m">highlighted row: lowest validation loss of the seven; arithmetic and sequence held-out accuracy are zero everywhere.</text><rect x="30" y="340" width="900" height="186" class="panel"/><text x="50" y="366" class="">WHY: the research asks whether memory sparsity (Engram) and compute sparsity (routing, recurrence) complement</text><text x="50" y="388" class="">     each other; this matrix is the answer at microscope scale, one row per combination, every number a committed run.</text><text x="50" y="414" class="">HOW: u:results_lookup reads each lesson's row from docs/reference/results.md; ME01 and RE01 come from the composed demo</text><text x="50" y="436" class="">     at R=1 and R=3 (one process each, finding F22); the other rows are the earlier lessons' committed rows.</text><text x="50" y="462" class="m">Active parameters count one embedding row, the shared block once per recurrence (attention, router, one expert, the</text><text x="50" y="484" class="m">Engram rows read plus its projection and gate), the final norm, and the head; bytes per token is active parameters at f64.</text><text x="50" y="508" class="m">Limitation: one seed and 90 training windows (DS01: data moves these columns more than any mechanism).</text></svg>