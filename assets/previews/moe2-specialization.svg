<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>MX02 specialization map</title><desc>Two heatmaps show, for each task family, the share of its answer tokens routed to each of four experts after training, for top-1 routing (MX01) and top-2 routing (MX02), with the specialization score of each; 0.25 would mean routing ignores the family and 1 would mean one expert per family.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">MX02 SPECIALIZATION -- which expert serves which task family</text><text x="32" y="60" class="m">WHAT: counts[family, expert] over masked training tokens, row-normalized; score = mean over families of the largest share</text><text x="32" y="96" class="k">MX01 top-1   score 0.61</text><rect x="122" y="120" width="42" height="42" class="heat" fill-opacity="0.37"/><text x="125" y="146" class="s">0.3</text><rect x="166" y="120" width="42" height="42" class="heat" fill-opacity="0.13"/><text x="169" y="146" class="s">0.03</text><rect x="210" y="120" width="42" height="42" class="heat" fill-opacity="0.22"/><text x="213" y="146" class="s">0.14</text><rect x="254" y="120" width="42" height="42" class="heat" fill-opacity="0.58"/><text x="257" y="146" class="s">0.53</text><rect x="122" y="164" width="42" height="42" class="heat" fill-opacity="0.65"/><text x="125" y="190" class="s">0.61</text><rect x="166" y="164" width="42" height="42" class="heat" fill-opacity="0.15"/><text x="169" y="190" class="s">0.05</text><rect x="210" y="164" width="42" height="42" class="heat" fill-opacity="0.21"/><text x="213" y="190" class="s">0.12</text><rect x="254" y="164" width="42" height="42" class="heat" fill-opacity="0.3"/><text x="257" y="190" class="s">0.22</text><rect x="122" y="208" width="42" height="42" class="heat" fill-opacity="0.34"/><text x="125" y="234" class="s">0.26</text><rect x="166" y="208" width="42" height="42" class="heat" fill-opacity="0.31"/><text x="169" y="234" class="s">0.24</text><rect x="210" y="208" width="42" height="42" class="heat" fill-opacity="0.17"/><text x="213" y="234" class="s">0.07</text><rect x="254" y="208" width="42" height="42" class="heat" fill-opacity="0.48"/><text x="257" y="234" class="s">0.43</text><rect x="122" y="252" width="42" height="42" class="heat" fill-opacity="0.88"/><text x="125" y="278" class="s">0.87</text><rect x="166" y="252" width="42" height="42" class="heat" fill-opacity="0.1"/><text x="169" y="278" class="s">0</text><rect x="210" y="252" width="42" height="42" class="heat" fill-opacity="0.22"/><text x="213" y="278" class="s">0.13</text><rect x="254" y="252" width="42" height="42" class="heat" fill-opacity="0.1"/><text x="257" y="278" class="s">0</text><text x="32" y="146" class="">arithmetic</text><text x="32" y="190" class="">sequence</text><text x="32" y="234" class="">mlpl</text><text x="32" y="278" class="">prose</text><text x="132" y="112" class="s">e0</text><text x="176" y="112" class="s">e1</text><text x="220" y="112" class="s">e2</text><text x="264" y="112" class="s">e3</text><text x="400" y="96" class="k">MX02 top-2   score 0.42</text><rect x="490" y="120" width="42" height="42" class="heat" fill-opacity="0.49"/><text x="493" y="146" class="s">0.44</text><rect x="534" y="120" width="42" height="42" class="heat" fill-opacity="0.13"/><text x="537" y="146" class="s">0.03</text><rect x="578" y="120" width="42" height="42" class="heat" fill-opacity="0.2"/><text x="581" y="146" class="s">0.11</text><rect x="622" y="120" width="42" height="42" class="heat" fill-opacity="0.47"/><text x="625" y="146" class="s">0.41</text><rect x="490" y="164" width="42" height="42" class="heat" fill-opacity="0.45"/><text x="493" y="190" class="s">0.39</text><rect x="534" y="164" width="42" height="42" class="heat" fill-opacity="0.25"/><text x="537" y="190" class="s">0.17</text><rect x="578" y="164" width="42" height="42" class="heat" fill-opacity="0.42"/><text x="581" y="190" class="s">0.36</text><rect x="622" y="164" width="42" height="42" class="heat" fill-opacity="0.18"/><text x="625" y="190" class="s">0.08</text><rect x="490" y="208" width="42" height="42" class="heat" fill-opacity="0.45"/><text x="493" y="234" class="s">0.39</text><rect x="534" y="208" width="42" height="42" class="heat" fill-opacity="0.23"/><text x="537" y="234" class="s">0.14</text><rect x="578" y="208" width="42" height="42" class="heat" fill-opacity="0.26"/><text x="581" y="234" class="s">0.18</text><rect x="622" y="208" width="42" height="42" class="heat" fill-opacity="0.36"/><text x="625" y="234" class="s">0.29</text><rect x="490" y="252" width="42" height="42" class="heat" fill-opacity="0.52"/><text x="493" y="278" class="s">0.46</text><rect x="534" y="252" width="42" height="42" class="heat" fill-opacity="0.27"/><text x="537" y="278" class="s">0.19</text><rect x="578" y="252" width="42" height="42" class="heat" fill-opacity="0.34"/><text x="581" y="278" class="s">0.27</text><rect x="622" y="252" width="42" height="42" class="heat" fill-opacity="0.17"/><text x="625" y="278" class="s">0.08</text><text x="400" y="146" class="">arithmetic</text><text x="400" y="190" class="">sequence</text><text x="400" y="234" class="">mlpl</text><text x="400" y="278" class="">prose</text><text x="500" y="112" class="s">e0</text><text x="544" y="112" class="s">e1</text><text x="588" y="112" class="s">e2</text><text x="632" y="112" class="s">e3</text><text x="720" y="120" class="">raw counts, MX02 (rows: families)</text><text x="720" y="142" class="s">76  6  20  72</text><text x="720" y="160" class="s">166  70  152  36</text><text x="720" y="178" class="s">53  19  24  40</text><text x="720" y="196" class="s">36  15  21  6</text><text x="720" y="230" class="">family-blind: every row 0.25</text><text x="720" y="250" class="">one expert per family: 1.0</text><text x="32" y="330" class="k">reading the map</text><text x="32" y="352" class="">A column that is bright in one row and dark in the others is an expert that one family owns.</text><text x="32" y="372" class="">A row that is bright across columns is a family whose tokens are spread over experts (top-2 spreads by construction).</text><text x="32" y="392" class="">Nothing here was labeled: the router saw hidden states, never the family tag. Specialization is emergent, or absent.</text><rect x="30" y="430" width="900" height="106" class="panel"/><text x="50" y="456" class="">WHY: the plan promised to measure specialization, not assume it; this map is also the target of the Saga 4 router warm start.</text><text x="50" y="478" class="">WHY: prose and arithmetic have distinct surface statistics and separate first; sequence and mlpl share digits and stay mixed.</text><text x="50" y="500" class="">HOW: u:top2_mask * mask row, one_hot(tag) outer counts, u:row_normalize, u:specialization_score; MX01 from its fixture.</text><text x="50" y="522" class="m">Observations moe2/family-by-expert and moe2/specialization; the MX01 fixture is regenerated by just moe write.</text></svg>