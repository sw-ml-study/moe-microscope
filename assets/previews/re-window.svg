<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>RE01 one window through the composed block</title><desc>For the example window 2+3=|5., the expert each token is routed to and the share of retrieved memory the Engram gate admits, at recurrence 1, 2, and 3 of the trained recurrent mixture plus Engram, with the change-of-expert share, loads, gate means, and nonzero rows of the run.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">ONE WINDOW -- expert and Engram gate at each recurrence</text><text x="32" y="60" class="m">WHAT: rows are recurrences; a cell is the expert chosen from that state, the percent is the mean Engram gate at that position.</text><text x="80" y="90" class="k">input</text><rect x="120" y="76" width="38" height="24" class="cell"/><text x="127" y="93" class="">2</text><rect x="160" y="76" width="38" height="24" class="cell"/><text x="167" y="93" class="">+</text><rect x="200" y="76" width="38" height="24" class="cell"/><text x="207" y="93" class="">3</text><rect x="240" y="76" width="38" height="24" class="cell"/><text x="247" y="93" class="">=</text><rect x="280" y="76" width="38" height="24" class="cell"/><text x="287" y="93" class="">|</text><rect x="320" y="76" width="38" height="24" class="cell"/><text x="327" y="93" class="">5</text><rect x="360" y="76" width="38" height="24" class="cell"/><text x="367" y="93" class="">.</text><rect x="120" y="116" width="36" height="22" class="t1"/><text x="130" y="132" class="">E1</text><text x="126" y="152" class="s">52%</text><rect x="160" y="116" width="36" height="22" class="t0"/><text x="170" y="132" class="">E0</text><text x="166" y="152" class="s">85%</text><rect x="200" y="116" width="36" height="22" class="t0"/><text x="210" y="132" class="">E0</text><text x="206" y="152" class="s">81%</text><rect x="240" y="116" width="36" height="22" class="t1"/><text x="250" y="132" class="">E1</text><text x="246" y="152" class="s">82%</text><rect x="280" y="116" width="36" height="22" class="t1"/><text x="290" y="132" class="">E1</text><text x="286" y="152" class="s">54%</text><rect x="320" y="116" width="36" height="22" class="t2"/><text x="330" y="132" class="">E2</text><text x="326" y="152" class="s">67%</text><rect x="360" y="116" width="36" height="22" class="t0"/><text x="370" y="132" class="">E0</text><text x="366" y="152" class="s">72%</text><text x="86" y="132" class="s">r=1</text><rect x="120" y="160" width="36" height="22" class="t1"/><text x="130" y="176" class="">E1</text><text x="126" y="196" class="s">61%</text><rect x="160" y="160" width="36" height="22" class="t2"/><text x="170" y="176" class="">E2</text><text x="166" y="196" class="s">68%</text><rect x="200" y="160" width="36" height="22" class="t1"/><text x="210" y="176" class="">E1</text><text x="206" y="196" class="s">60%</text><rect x="240" y="160" width="36" height="22" class="t1"/><text x="250" y="176" class="">E1</text><text x="246" y="196" class="s">51%</text><rect x="280" y="160" width="36" height="22" class="t1"/><text x="290" y="176" class="">E1</text><text x="286" y="196" class="s">56%</text><rect x="320" y="160" width="36" height="22" class="t0"/><text x="330" y="176" class="">E0</text><text x="326" y="196" class="s">76%</text><rect x="360" y="160" width="36" height="22" class="t1"/><text x="370" y="176" class="">E1</text><text x="366" y="196" class="s">47%</text><text x="86" y="176" class="s">r=2</text><rect x="120" y="204" width="36" height="22" class="t1"/><text x="130" y="220" class="">E1</text><text x="126" y="240" class="s">60%</text><rect x="160" y="204" width="36" height="22" class="t2"/><text x="170" y="220" class="">E2</text><text x="166" y="240" class="s">70%</text><rect x="200" y="204" width="36" height="22" class="t1"/><text x="210" y="220" class="">E1</text><text x="206" y="240" class="s">58%</text><rect x="240" y="204" width="36" height="22" class="t1"/><text x="250" y="220" class="">E1</text><text x="246" y="240" class="s">35%</text><rect x="280" y="204" width="36" height="22" class="t1"/><text x="290" y="220" class="">E1</text><text x="286" y="240" class="s">56%</text><rect x="320" y="204" width="36" height="22" class="t3"/><text x="330" y="220" class="">E3</text><text x="326" y="240" class="s">79%</text><rect x="360" y="204" width="36" height="22" class="t1"/><text x="370" y="220" class="">E1</text><text x="366" y="240" class="s">25%</text><text x="86" y="220" class="s">r=3</text><text x="440" y="90" class="k">RE01 run (R=3)</text><text x="440" y="114" class="">change-of-expert share 0.31</text><text x="440" y="136" class="">router entropy 0.815   balance 1.081</text><text x="440" y="158" class="">gate mean per recurrence 0.76  0.739  0.725</text><text x="440" y="180" class="">specialization per recurrence 0.53  0.383  0.355</text><text x="440" y="202" class="">loads per recurrence 211  54  92  49  128  113  120  45  122  114  137  33</text><text x="440" y="224" class="">nonzero table rows 364   val loss 4.757</text><text x="440" y="256" class="k">ME01 run (R=1) for comparison</text><text x="440" y="278" class="">val loss 4.601   gate mean 0.671   entropy 0.687</text><text x="80" y="270" class="k">legend</text><rect x="140" y="256" width="30" height="18" class="t0"/><rect x="180" y="256" width="30" height="18" class="t1"/><rect x="220" y="256" width="30" height="18" class="t2"/><rect x="260" y="256" width="30" height="18" class="t3"/><text x="300" y="270" class="">experts 0..3</text><rect x="30" y="300" width="900" height="226" class="panel"/><text x="50" y="326" class="">WHY: in the composed block the Engram layer sits between attention and the router at every recurrence, so the router</text><text x="50" y="348" class="">     decides on a state that already holds retrieved memory, and the gate can admit different amounts at each recurrence.</text><text x="50" y="374" class="">HOW: u:re_step is attention residual, Engram (u:engram_apply on the window's rows), routed mixture residual; u:re_route</text><text x="50" y="396" class="">     and u:re_gate read the expert and gate from a state; training is deep-supervised with the balance term per</text><text x="50" y="418" class="">     recurrence (alpha 0.01) and the table in the Adam parameter list; one process per R (finding F22).</text><text x="50" y="448" class="m">The recording's re/route/example and re/gate/example hold these cells; rows ME01 and RE01 hold loss, accuracy, entropy,</text><text x="50" y="470" class="m">balance, specialization, and gate mean; ms per token is in the results table only.</text><text x="50" y="500" class="m">Limitation: one window, one seed; the percentages are means over the sixteen hidden dimensions.</text></svg>