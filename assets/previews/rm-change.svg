<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>Recurrent mixture: loads, entropy, balance, and change per recurrence</title><desc>Tokens per expert at each recurrence for the R=2 and R=3 runs over the masked training positions, with mean router entropy, mean balance, the change-of-expert share, and the held-out results.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">LOADS PER RECURRENCE -- do the experts stay balanced at every step?</text><text x="32" y="60" class="m">WHAT: tokens routed to each expert at each recurrence over the 90 training windows' masked positions (E0..E3), per run.</text><text x="40" y="92" class="k">R=2 run: recurrence 1</text><text x="40" y="112" class="s">E0</text><rect x="90" y="102" width="72.5" height="12" class="tr"/><text x="168.5" y="112" class="s">145</text><text x="40" y="132" class="s">E1</text><rect x="90" y="122" width="50.5" height="12" class="tr"/><text x="146.5" y="132" class="s">101</text><text x="40" y="152" class="s">E2</text><rect x="90" y="142" width="55" height="12" class="tr"/><text x="151" y="152" class="s">110</text><text x="40" y="172" class="s">E3</text><rect x="90" y="162" width="25" height="12" class="tr"/><text x="121" y="172" class="s">50</text><text x="40" y="190" class="k">R=2 run: recurrence 2</text><text x="40" y="210" class="s">E0</text><rect x="90" y="200" width="22" height="12" class="tr"/><text x="118" y="210" class="s">44</text><text x="40" y="230" class="s">E1</text><rect x="90" y="220" width="66.5" height="12" class="tr"/><text x="162.5" y="230" class="s">133</text><text x="40" y="250" class="s">E2</text><rect x="90" y="240" width="86.5" height="12" class="tr"/><text x="182.5" y="250" class="s">173</text><text x="40" y="270" class="s">E3</text><rect x="90" y="260" width="28" height="12" class="tr"/><text x="124" y="270" class="s">56</text><text x="340" y="92" class="k">R=3 run: recurrence 1</text><text x="340" y="112" class="s">E0</text><rect x="390" y="102" width="122.5" height="12" class="va"/><text x="518.5" y="112" class="s">245</text><text x="340" y="132" class="s">E1</text><rect x="390" y="122" width="11.5" height="12" class="va"/><text x="407.5" y="132" class="s">23</text><text x="340" y="152" class="s">E2</text><rect x="390" y="142" width="55" height="12" class="va"/><text x="451" y="152" class="s">110</text><text x="340" y="172" class="s">E3</text><rect x="390" y="162" width="14" height="12" class="va"/><text x="410" y="172" class="s">28</text><text x="340" y="190" class="k">R=3 run: recurrence 2</text><text x="340" y="210" class="s">E0</text><rect x="390" y="200" width="40.5" height="12" class="va"/><text x="436.5" y="210" class="s">81</text><text x="340" y="230" class="s">E1</text><rect x="390" y="220" width="60.5" height="12" class="va"/><text x="456.5" y="230" class="s">121</text><text x="340" y="250" class="s">E2</text><rect x="390" y="240" width="80" height="12" class="va"/><text x="476" y="250" class="s">160</text><text x="340" y="270" class="s">E3</text><rect x="390" y="260" width="22" height="12" class="va"/><text x="418" y="270" class="s">44</text><text x="340" y="288" class="k">R=3 run: recurrence 3</text><text x="340" y="308" class="s">E0</text><rect x="390" y="298" width="32.5" height="12" class="va"/><text x="428.5" y="308" class="s">65</text><text x="340" y="328" class="s">E1</text><rect x="390" y="318" width="55.5" height="12" class="va"/><text x="451.5" y="328" class="s">111</text><text x="340" y="348" class="s">E2</text><rect x="390" y="338" width="86.5" height="12" class="va"/><text x="482.5" y="348" class="s">173</text><text x="340" y="368" class="s">E3</text><rect x="390" y="358" width="28.5" height="12" class="va"/><text x="424.5" y="368" class="s">57</text><text x="640" y="92" class="k">diagnostics</text><text x="640" y="116" class="">entropy      R=2 0.813   R=3 0.808</text><text x="640" y="138" class="">balance      R=2 1.116   R=3 1.225</text><text x="640" y="160" class="">change share R=2 0.464   R=3 0.381</text><text x="640" y="182" class="">val loss     R=2 4.093   R=3 3.415</text><text x="640" y="204" class="">held-out mlpl R=2 0.143   R=3 0.286</text><text x="640" y="226" class="">held-out prose R=2 0.667   R=3 0.667</text><rect x="30" y="390" width="900" height="130" class="panel"/><text x="50" y="418" class="">WHY: the balance term is applied at every recurrence, so loads should stay spread at each step; a recurrence whose</text><text x="50" y="440" class="">     loads collapse onto one expert would mean the later routing decisions carry no information.</text><text x="50" y="466" class="">HOW: u:routing_stats re-routes every training window through the trained model and accumulates masked counts per</text><text x="50" y="488" class="">     recurrence; entropy and balance are means over windows and recurrences. Compare MX01 at R=1: loads 208, 30, 47, 121.</text></svg>