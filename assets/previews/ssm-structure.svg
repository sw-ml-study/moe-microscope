<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>SS01 state-space block structure</title><desc>One window flows through the embedding, positions, an RMS norm, the input projection B, the diagonal scan whose state is one 32-value vector updated once per position, the output projection C, the residual, the DN01 feed-forward block, the norm, and the head; the learned decay per state dimension is drawn as a strip, and the persistent state bytes are compared with the key and value rows attention keeps per token.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">SS01 STATE-SPACE BLOCK -- one window, one fixed-size state</text><text x="32" y="60" class="m">WHAT: 3844 parameters; the scan block has 1056 against DN01 attention's 1024 (matched); no key or value is stored</text><rect x="32" y="80" width="148" height="64" class="box"/><text x="40" y="98" class="k">ids [T]</text><text x="40" y="116" class="">52-symbol alphabet</text><text x="40" y="134" class="m">0 params</text><rect x="192" y="80" width="176" height="64" class="box"/><text x="200" y="98" class="k">embed [T,16]</text><text x="200" y="116" class="">+ sinusoidal positions</text><text x="200" y="134" class="m">832 params</text><rect x="380" y="80" width="150" height="64" class="box"/><text x="388" y="98" class="k">xB [T,32]</text><text x="388" y="116" class="">rms_norm, then x B</text><text x="388" y="134" class="m">B: 512 params</text><rect x="542" y="80" width="210" height="64" class="box"/><text x="550" y="98" class="k">s_t = a*s_(t-1) + xB_t</text><text x="550" y="116" class="">state [T,32]; a=sigmoid(A)</text><text x="550" y="134" class="m">A: 32 params; 256 B live</text><rect x="764" y="80" width="166" height="64" class="box"/><text x="772" y="98" class="k">h1 = h0 + s C</text><text x="772" y="116" class="">C: [32,16], residual</text><text x="772" y="134" class="m">C: 512 params</text><rect x="542" y="160" width="210" height="64" class="box"/><text x="550" y="178" class="k">h2 = h1 + ffn(h1)</text><text x="550" y="196" class="">rms_norm, 16->32 relu 32->16</text><text x="550" y="214" class="m">1072 params</text><rect x="764" y="160" width="166" height="64" class="box"/><text x="772" y="178" class="k">norm + head [T,52]</text><text x="772" y="196" class="">rms_norm, linear 16->52</text><text x="772" y="214" class="m">884 params</text><text x="32" y="258" class="k">learned decay a per state dimension (0 = forget at once, 1 = accumulate forever); trained from 0.9</text><rect x="32" y="266" width="26" height="26" class="heat" fill-opacity="0.88"/><text x="35" y="284" class="s">0.87</text><rect x="60" y="266" width="26" height="26" class="heat" fill-opacity="0.56"/><text x="63" y="284" class="s">0.51</text><rect x="88" y="266" width="26" height="26" class="heat" fill-opacity="0.8"/><text x="91" y="284" class="s">0.77</text><rect x="116" y="266" width="26" height="26" class="heat" fill-opacity="0.64"/><text x="119" y="284" class="s">0.6</text><rect x="144" y="266" width="26" height="26" class="heat" fill-opacity="0.78"/><text x="147" y="284" class="s">0.75</text><rect x="172" y="266" width="26" height="26" class="heat" fill-opacity="0.62"/><text x="175" y="284" class="s">0.57</text><rect x="200" y="266" width="26" height="26" class="heat" fill-opacity="0.84"/><text x="203" y="284" class="s">0.83</text><rect x="228" y="266" width="26" height="26" class="heat" fill-opacity="0.95"/><text x="231" y="284" class="s">0.94</text><rect x="256" y="266" width="26" height="26" class="heat" fill-opacity="0.93"/><text x="259" y="284" class="s">0.92</text><rect x="284" y="266" width="26" height="26" class="heat" fill-opacity="0.92"/><text x="287" y="284" class="s">0.92</text><rect x="312" y="266" width="26" height="26" class="heat" fill-opacity="0.76"/><text x="315" y="284" class="s">0.74</text><rect x="340" y="266" width="26" height="26" class="heat" fill-opacity="0.61"/><text x="343" y="284" class="s">0.57</text><rect x="368" y="266" width="26" height="26" class="heat" fill-opacity="0.33"/><text x="371" y="284" class="s">0.26</text><rect x="396" y="266" width="26" height="26" class="heat" fill-opacity="0.81"/><text x="399" y="284" class="s">0.79</text><rect x="424" y="266" width="26" height="26" class="heat" fill-opacity="0.91"/><text x="427" y="284" class="s">0.91</text><rect x="452" y="266" width="26" height="26" class="heat" fill-opacity="0.46"/><text x="455" y="284" class="s">0.41</text><rect x="480" y="266" width="26" height="26" class="heat" fill-opacity="0.87"/><text x="483" y="284" class="s">0.86</text><rect x="508" y="266" width="26" height="26" class="heat" fill-opacity="0.93"/><text x="511" y="284" class="s">0.92</text><rect x="536" y="266" width="26" height="26" class="heat" fill-opacity="0.96"/><text x="539" y="284" class="s">0.96</text><rect x="564" y="266" width="26" height="26" class="heat" fill-opacity="0.87"/><text x="567" y="284" class="s">0.86</text><rect x="592" y="266" width="26" height="26" class="heat" fill-opacity="0.93"/><text x="595" y="284" class="s">0.92</text><rect x="620" y="266" width="26" height="26" class="heat" fill-opacity="0.98"/><text x="623" y="284" class="s">0.98</text><rect x="648" y="266" width="26" height="26" class="heat" fill-opacity="0.79"/><text x="651" y="284" class="s">0.77</text><rect x="676" y="266" width="26" height="26" class="heat" fill-opacity="0.93"/><text x="679" y="284" class="s">0.92</text><rect x="704" y="266" width="26" height="26" class="heat" fill-opacity="0.87"/><text x="707" y="284" class="s">0.85</text><rect x="732" y="266" width="26" height="26" class="heat" fill-opacity="0.47"/><text x="735" y="284" class="s">0.42</text><rect x="760" y="266" width="26" height="26" class="heat" fill-opacity="0.95"/><text x="763" y="284" class="s">0.95</text><rect x="788" y="266" width="26" height="26" class="heat" fill-opacity="0.6"/><text x="791" y="284" class="s">0.56</text><rect x="816" y="266" width="26" height="26" class="heat" fill-opacity="0.92"/><text x="819" y="284" class="s">0.91</text><rect x="844" y="266" width="26" height="26" class="heat" fill-opacity="0.76"/><text x="847" y="284" class="s">0.74</text><rect x="872" y="266" width="26" height="26" class="heat" fill-opacity="0.61"/><text x="875" y="284" class="s">0.57</text><rect x="900" y="266" width="26" height="26" class="heat" fill-opacity="0.78"/><text x="903" y="284" class="s">0.76</text><text x="32" y="318" class="">min 0.257   mean 0.759   max 0.975</text><text x="32" y="352" class="k">persistent sequence state at f64, per history length (D, derived from shapes):</text><text x="32" y="372" class="">history (tokens)</text><text x="182" y="372" class="">16</text><text x="262" y="372" class="">64</text><text x="342" y="372" class="">256</text><text x="422" y="372" class="">1024</text><text x="512" y="372" class="m"></text><text x="672" y="372" class="m"></text><text x="32" y="392" class="">attention (B)</text><text x="182" y="392" class="">4096</text><text x="262" y="392" class="">16384</text><text x="342" y="392" class="">65536</text><text x="422" y="392" class="">262144</text><text x="512" y="392" class="m">2 x history x 16 x 8:</text><text x="672" y="392" class="m">a key and a value row per token</text><text x="32" y="412" class="">scan (B)</text><text x="182" y="412" class="">256</text><text x="262" y="412" class="">256</text><text x="342" y="412" class="">256</text><text x="422" y="412" class="">256</text><text x="512" y="412" class="m">32 x 8:</text><text x="672" y="412" class="m">one state, whatever the history</text><rect x="30" y="432" width="900" height="96" class="panel"/><text x="50" y="458" class="">WHY: attention's working memory grows with the history; a state-space block carries the history in one vector that decays per</text><text x="50" y="478" class="">     dimension, so decode memory is constant. The question is what a 256-byte state can learn here, at matched parameters.</text><text x="50" y="500" class="">HOW: lib/ssm.mlpl writes the scan as one repeat per position (traced by grad); u:body adds the residual; adam trains A, B, C with the rest.</text><text x="50" y="520" class="m">Sequential by construction: no parallel scan; the microseconds per token are measured in the state-bytes diagram.</text></svg>