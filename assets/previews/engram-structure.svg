ight="14" class="heat" stroke="none" fill-opacity="0.16"/><rect x="176" y="328" width="18" height="14" class="heat" stroke="none" fill-opacity="0.31"/><rect x="194" y="328" width="18" height="14" class="heat" stroke="none" fill-opacity="0.23"/><rect x="212" y="328" width="18" height="14" class="heat" stroke="none" fill-opacity="0.15"/><rect x="230" y="328" width="18" height="14" class="heat" stroke="none" fill-opacity="0.56"/><rect x="248" y="328" width="18" height="14" class="heat" stroke="none" fill-opacity="0.13"/><rect x="266" y="328" width="18" height="14" class="heat" stroke="none" fill-opacity="0.2"/><rect x="284" y="328" width="18" height="14" class="heat" stroke="none" fill-opacity="0.21"/><rect x="302" y="328" width="18" height="14" class="heat" stroke="none" fill-opacity="0.31"/><rect x="32" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.54"/><rect x="50" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.31"/><rect x="68" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.34"/><rect x="86" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.48"/><rect x="104" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.62"/><rect x="122" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.53"/><rect x="140" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.55"/><rect x="158" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.3"/><rect x="176" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.08"/><rect x="194" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.08"/><rect x="212" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.08"/><rect x="230" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.08"/><rect x="248" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.08"/><rect x="266" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.08"/><rect x="284" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.08"/><rect x="302" y="342" width="18" height="14" class="heat" stroke="none" fill-opacity="0.08"/><text x="340" y="320" class="k">gate mean per position</text><rect x="340" y="328" width="28" height="24" class="cell"/><text x="345" y="345" class="">31</text><rect x="370" y="328" width="28" height="24" class="cell"/><text x="375" y="345" class="">68</text><rect x="400" y="328" width="28" height="24" class="cell"/><text x="405" y="345" class="">83</text><rect x="430" y="328" width="28" height="24" class="cell"/><text x="435" y="345" class="">87</text><rect x="460" y="328" width="28" height="24" class="cell"/><text x="465" y="345" class="">88</text><rect x="490" y="328" width="28" height="24" class="cell"/><text x="495" y="345" class="">87</text><rect x="520" y="328" width="28" height="24" class="cell"/><text x="525" y="345" class="">74</text><text x="560" y="345" class="m">(percent of the value admitted)</text><text x="340" y="380" class="k">mean |value| per position</text><rect x="340" y="388" width="42" height="24" class="cell"/><text x="345" y="405" class="">1.96</text><rect x="384" y="388" width="42" height="24" class="cell"/><text x="389" y="405" class="">1.83</text><rect x="428" y="388" width="42" height="24" class="cell"/><text x="433" y="405" class="">0.31</text><rect x="472" y="388" width="42" height="24" class="cell"/><text x="477" y="405" class="">4.52</text><rect x="516" y="388" width="42" height="24" class="cell"/><text x="521" y="405" class="">2.5</text><rect x="560" y="388" width="42" height="24" class="cell"/><text x="565" y="405" class="">2.93</text><rect x="604" y="388" width="42" height="24" class="cell"/><text x="609" y="405" class="">2.75</text><text x="660" y="405" class="m">(before the gate)</text><rect x="30" y="420" width="900" height="100" class="panel"/><text x="50" y="444" class="">WHY: the table is memory the network need not reconstruct: a recurring context reads back what training wrote,</text><text x="50" y="464" class="">for a hash and two row reads per token. Rows never addressed stay zero: storage can far exceed what a token touches.</text><text x="50" y="484" class="">HOW: u:engram_rows, u:engram_retrieve (gather_rows), u:engram_value, u:engram_gate, u:engram_apply in lib/engram.mlpl;</text><text x="50" y="504" class="m">the same shapes and initialization as the engram builtin, so the two forms agree exactly (parity panel).</text></svg>