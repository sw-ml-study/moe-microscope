<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>EG01 Engram data structure</title><desc>The example 2+3=|5. is hashed into a 2-gram row and a 3-gram row per position, those rows are gathered from one table, projected into the hidden width, gated against the hidden state, and added to it; each stage shows its shape, parameters, and bytes.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">ENGRAM FROM SCRATCH -- one window through the table (256 slots per order)</text><text x="32" y="60" class="m">WHAT: 4096 table parameters (32768 B) plus 800 projection and gate parameters next to the 3,812-parameter dense block.</text><text x="32" y="96" class="k">chars</text><rect x="120" y="79" width="28" height="24" class="cell"/><text x="127" y="96" class="">2</text><rect x="150" y="79" width="28" height="24" class="cell"/><text x="157" y="96" class="">+</text><rect x="180" y="79" width="28" height="24" class="cell"/><text x="187" y="96" class="">3</text><rect x="210" y="79" width="28" height="24" class="cell"/><text x="217" y="96" class="">=</text><rect x="240" y="79" width="28" height="24" class="cell"/><text x="247" y="96" class="">|</text><rect x="270" y="79" width="28" height="24" class="cell"/><text x="277" y="96" class="">5</text><rect x="300" y="79" width="28" height="24" class="cell"/><text x="307" y="96" class="">.</text><text x="32" y="130" class="k">ids</text><rect x="120" y="113" width="28" height="24" class="cell"/><text x="125" y="130" class="">4</text><rect x="150" y="113" width="28" height="24" class="cell"/><text x="155" y="130" class="">12</text><rect x="180" y="113" width="28" height="24" class="cell"/><text x="185" y="130" class="">5</text><rect x="210" y="113" width="28" height="24" class="cell"/><text x="215" y="130" class="">15</text><rect x="240" y="113" width="28" height="24" class="cell"/><text x="245" y="130" class="">50</text><rect x="270" y="113" width="28" height="24" class="cell"/><text x="275" y="130" class="">7</text><rect x="300" y="113" width="28" height="24" class="cell"/><text x="305" y="130" class="">51</text><text x="32" y="164" class="k">2-gram row</text><rect x="120" y="147" width="29" height="24" class="cell"/><text x="125" y="164" class="">81</text><rect x="151" y="147" width="29" height="24" class="cell"/><text x="156" y="164" class="">205</text><rect x="182" y="147" width="29" height="24" class="cell"/><text x="187" y="164" class="">179</text><rect x="213" y="147" width="29" height="24" class="cell"/><text x="218" y="164" class="">128</text><rect x="244" y="147" width="29" height="24" class="cell"/><text x="249" y="164" class="">169</text><rect x="275" y="147" width="29" height="24" class="cell"/><text x="280" y="164" class="">118</text><rect x="306" y="147" width="29" height="24" class="cell"/><text x="311" y="164" class="">200</text><text x="32" y="198" class="k">3-gram row</text><rect x="120" y="181" width="29" height="24" class="cell"/><text x="125" y="198" class="">483</text><rect x="151" y="181" width="29" height="24" class="cell"/><text x="156" y="198" class="">476</text><rect x="182" y="181" width="29" height="24" class="cell"/><text x="187" y="198" class="">289</text><rect x="213" y="181" width="29" height="24" class="cell"/><text x="218" y="198" class="">409</text><rect x="244" y="181" width="29" height="24" class="cell"/><text x="249" y="198" class="">318</text><rect x="275" y="181" width="29" height="24" class="cell"/><text x="280" y="198" class="">387</text><rect x="306" y="181" width="29" height="24" class="cell"/><text x="311" y="198" class="">511</text><text x="340" y="96" class="m">HOW: ngram_hash(ids, [2, 3], 1, slots, 7): the frozen rolling hash of the</text><text x="340" y="114" class="m">last two and three ids (pad 0 before the start); the 3-gram row adds the</text><text x="340" y="132" class="m">region offset 256 (head_offset). Indices are constants: no gradient.</text><rect x="340" y="150" width="190" height="64" class="box"/><text x="348" y="168" class="k">table [512, 8]</text><text x="348" y="186" class="">4096 params, zero init</text><text x="348" y="204" class="m">32768 B</text><rect x="548" y="150" width="180" height="64" class="box"/><text x="556" y="168" class="k">retrieved [T, 16]</text><text x="556" y="186" class="">gather_rows, 2 rows x 8</text><text x="556" y="204" class="m">128 B read per token</text><rect x="746" y="150" width="184" height="64" class="box"/><text x="754" y="168" class="k">value [T, 16]</text><text x="754" y="186" class="">r @ Wv + bv, 16 -> 16</text><text x="754" y="204" class="m">272 params</text><rect x="548" y="230" width="180" height="64" class="box"/><text x="556" y="248" class="k">gate [T, 16]</text><text x="556" y="266" class="">sigmoid([h | v] @ Wg + bg)</text><text x="556" y="284" class="m">528 params, bg = -2</text><rect x="746" y="230" width="184" height="64" class="box"/><text x="754" y="248" class="k">h + gate * value</text><text x="754" y="266" class="">into the residual stream</text><text x="754" y="284" class="m">after att, before ffn</text><text x="32" y="250" class="k">retrieved values per position (2-gram | 3-gram), by magnitude</text><rect x="32" y="258" width="18" height="14" class="heat" stroke="none" fill-opacity="0.43"/><re