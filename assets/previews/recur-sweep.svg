<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>Recurrence sweep</title><desc>Validation loss and held-out accuracy against the number of recurrences at fixed parameters, and the validation loss of the R=4 model when stopped after each recurrence; four separate training runs.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">RECURRENCE SWEEP -- what R buys at fixed parameters</text><text x="32" y="60" class="m">WHAT: the same 3812 parameters trained 300 epochs at R = 1, 2, 3, 4, one process per R; every number is a measured result.</text><text x="40" y="92" class="k">validation loss (lower is better)</text><text x="40" y="112" class="">R=1</text><rect x="100" y="101" width="159.1299784631987" height="14" class="tr"/><text x="265.1299784631987" y="112" class="s">3.789</text><text x="40" y="134" class="">R=2</text><rect x="100" y="123" width="145.08738174053113" height="14" class="tr"/><text x="251.08738174053113" y="134" class="s">3.454</text><text x="40" y="156" class="">R=3</text><rect x="100" y="145" width="156.6349482138156" height="14" class="tr"/><text x="262.6349482138156" y="156" class="s">3.729</text><text x="40" y="178" class="">R=4</text><rect x="100" y="167" width="177.2709559986077" height="14" class="tr"/><text x="283.2709559986077" y="178" class="s">4.221</text><text x="340" y="92" class="k">held-out exact match, overall</text><text x="340" y="112" class="">R=1</text><rect x="400" y="101" width="20" height="14" class="va"/><text x="426" y="112" class="s">0.067</text><text x="340" y="134" class="">R=2</text><rect x="400" y="123" width="20" height="14" class="va"/><text x="426" y="134" class="s">0.067</text><text x="340" y="156" class="">R=3</text><rect x="400" y="145" width="40" height="14" class="va"/><text x="446" y="156" class="s">0.133</text><text x="340" y="178" class="">R=4</text><rect x="400" y="167" width="30" height="14" class="va"/><text x="436" y="178" class="s">0.1</text><text x="640" y="92" class="k">held-out prose exact match</text><text x="640" y="112" class="">R=1</text><rect x="700" y="101" width="200" height="14" class="va"/><text x="906" y="112" class="s">0.667</text><text x="640" y="134" class="">R=2</text><rect x="700" y="123" width="200" height="14" class="va"/><text x="906" y="134" class="s">0.667</text><text x="640" y="156" class="">R=3</text><rect x="700" y="145" width="200" height="14" class="va"/><text x="906" y="156" class="s">0.667</text><text x="640" y="178" class="">R=4</text><rect x="700" y="167" width="200" height="14" class="va"/><text x="906" y="178" class="s">0.667</text><text x="40" y="206" class="k">R=4 model, validation loss when stopped after r recurrences</text><text x="40" y="226" class="">r=1</text><rect x="100" y="215" width="151.26028649327256" height="14" class="tr"/><text x="257.2602864932726" y="226" class="s">3.601</text><text x="40" y="248" class="">r=2</text><rect x="100" y="237" width="173.48184897922613" height="14" class="tr"/><text x="279.48184897922613" y="248" class="s">4.131</text><text x="40" y="270" class="">r=3</text><rect x="100" y="259" width="177.72467457712898" height="14" class="tr"/><text x="283.724674577129" y="270" class="s">4.232</text><text x="40" y="292" class="">r=4</text><rect x="100" y="281" width="177.2709559986077" height="14" class="tr"/><text x="283.2709559986077" y="292" class="s">4.221</text><rect x="30" y="320" width="900" height="200" class="panel"/><text x="50" y="348" class="">WHY: if the block learned a repeatable step, stopping early should hurt and R=4 should beat R=1 at the same storage;</text><text x="50" y="370" class="">     if not, recurrence adds compute (R times the block per token) without quality, which is also a result.</text><text x="50" y="396" class="">HOW: each R trains from the same seeds with the same budget in its own process (adam state is keyed by name and would</text><text x="50" y="418" class="">     leak between runs, finding F22); val loss is the masked loss at the final recurrence; accuracy is greedy exact match</text><text x="50" y="440" class="">     on the 30 held-out prompts; the per-recurrence panel re-scores the trained R=4 model after 1, 2, 3, 4 recurrences.</text><text x="50" y="468" class="m">Limitation: 90 training windows and one seed (finding 4: data, not epochs, moves the held-out columns); ms per token</text><text x="50" y="490" class="m">and the rows RC01@1..4 are in docs/reference/results.md, never drawn here, so this diagram stays byte-stable.</text></svg>