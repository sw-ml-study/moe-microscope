<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>Expert sequence per token over recurrences</title><desc>For the example window 2+3=|5., the expert each token is routed to at recurrence 1, 2, and 3 of the trained R=3 mixture, and the change-of-expert share over the training rows.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">ROUTING OVER REASONING TIME -- which expert, at which recurrence</text><text x="32" y="60" class="m">WHAT: rows are recurrences, columns are the positions of 2+3=|5.; a cell is the expert chosen from that state.</text><text x="80" y="90" class="k">input</text><rect x="120" y="76" width="32" height="24" class="cell"/><text x="127" y="93" class="">2</text><rect x="154" y="76" width="32" height="24" class="cell"/><text x="161" y="93" class="">+</text><rect x="188" y="76" width="32" height="24" class="cell"/><text x="195" y="93" class="">3</text><rect x="222" y="76" width="32" height="24" class="cell"/><text x="229" y="93" class="">=</text><rect x="256" y="76" width="32" height="24" class="cell"/><text x="263" y="93" class="">|</text><rect x="290" y="76" width="32" height="24" class="cell"/><text x="297" y="93" class="">5</text><rect x="324" y="76" width="32" height="24" class="cell"/><text x="331" y="93" class="">.</text><rect x="120" y="116" width="30" height="22" class="t3"/><text x="130" y="132" class="">E3</text><rect x="154" y="116" width="30" height="22" class="t0"/><text x="164" y="132" class="">E0</text><rect x="188" y="116" width="30" height="22" class="t2"/><text x="198" y="132" class="">E2</text><rect x="222" y="116" width="30" height="22" class="t0"/><text x="232" y="132" class="">E0</text><rect x="256" y="116" width="30" height="22" class="t0"/><text x="266" y="132" class="">E0</text><rect x="290" y="116" width="30" height="22" class="t0"/><text x="300" y="132" class="">E0</text><rect x="324" y="116" width="30" height="22" class="t1"/><text x="334" y="132" class="">E1</text><text x="86" y="132" class="s">r=1</text><rect x="120" y="142" width="30" height="22" class="t3"/><text x="130" y="158" class="">E3</text><rect x="154" y="142" width="30" height="22" class="t2"/><text x="164" y="158" class="">E2</text><rect x="188" y="142" width="30" height="22" class="t2"/><text x="198" y="158" class="">E2</text><rect x="222" y="142" width="30" height="22" class="t2"/><text x="232" y="158" class="">E2</text><rect x="256" y="142" width="30" height="22" class="t3"/><text x="266" y="158" class="">E3</text><rect x="290" y="142" width="30" height="22" class="t2"/><text x="300" y="158" class="">E2</text><rect x="324" y="142" width="30" height="22" class="t0"/><text x="334" y="158" class="">E0</text><text x="86" y="158" class="s">r=2</text><rect x="120" y="168" width="30" height="22" class="t3"/><text x="130" y="184" class="">E3</text><rect x="154" y="168" width="30" height="22" class="t1"/><text x="164" y="184" class="">E1</text><rect x="188" y="168" width="30" height="22" class="t2"/><text x="198" y="184" class="">E2</text><rect x="222" y="168" width="30" height="22" class="t2"/><text x="232" y="184" class="">E2</text><rect x="256" y="168" width="30" height="22" class="t0"/><text x="266" y="184" class="">E0</text><rect x="290" y="168" width="30" height="22" class="t2"/><text x="300" y="184" class="">E2</text><rect x="324" y="168" width="30" height="22" class="t0"/><text x="334" y="184" class="">E0</text><text x="86" y="184" class="s">r=3</text><text x="420" y="90" class="k">change-of-expert share over the training rows</text><text x="420" y="114" class="">R=2: 0.464</text><text x="420" y="136" class="">R=3: 0.381</text><text x="420" y="160" class="m">share of masked tokens whose expert differs between consecutive</text><text x="420" y="178" class="m">recurrences; zero would mean the router ignores reasoning time.</text><text x="80" y="220" class="k">legend</text><rect x="140" y="206" width="30" height="18" class="t0"/><rect x="180" y="206" width="30" height="18" class="t1"/><rect x="220" y="206" width="30" height="18" class="t2"/><rect x="260" y="206" width="30" height="18" class="t3"/><text x="300" y="220" class="">experts 0, 1, 2, 3</text><rect x="30" y="250" width="900" height="270" class="panel"/><text x="50" y="278" class="">WHY: in a recurrent mixture the router runs once per recurrence, so the same token can consult different experts in</text><text x="50" y="300" class="">     sequence; that is routing over reasoning time, the RM01 question. A strip that never changes color means the</text><text x="50" y="322" class="">     recurrences add compute but not a new decision.</text><text x="50" y="348" class="">HOW: u:rm_route reads the router's argmax from a state; u:rm_step advances the state (attention residual, routed</text><text x="50" y="370" class="">     mixture residual); u:rm_change_share counts masked tokens whose expert differs between consecutive recurrences.</text><text x="50" y="396" class="">HOW: training is deep-supervised (the head scored at every recurrence) with the balance term applied to every</text><text x="50" y="418" class="">     recurrence's routing (alpha 0.01), one process per R (finding F22); the R=3 run is the pinned recording.</text><text x="50" y="448" class="m">The recording's rm/route/example holds these cells; rows RM01@2 and RM01@3 hold loss, accuracy, entropy, balance, and</text><text x="50" y="470" class="m">specialization; ms per token is in the results table only.</text></svg>