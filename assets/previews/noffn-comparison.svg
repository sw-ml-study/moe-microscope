="">25051</text><text x="262" y="332" class="">0.938</text><text x="330" y="332" class="">0.925</text><text x="392" y="332" class="">0.444</text><text x="490" y="332" class="">0.3</text><text x="40" y="352" class="">MB01 matcher</text><text x="196" y="352" class="">0</text><text x="262" y="352" class="">0.78</text><text x="330" y="352" class="">0.954</text><text x="392" y="352" class="">0.63</text><text x="490" y="352" class="">1</text><text x="40" y="372" class="">MB01t matcher+text</text><text x="196" y="372" class="">0</text><text x="262" y="372" class="">0.759</text><text x="330" y="372" class="">0.925</text><text x="392" y="372" class="">0.685</text><text x="490" y="372" class="">0.4</text><rect x="30" y="406" width="900" height="114" class="panel"/><text x="50" y="432" class="">WHY: sw-atlas drops feed-forward layers so the model cannot memorise facts; the microscope checks the cost on a corpus it has.</text><text x="50" y="454" class="">HOW: SAN01 is CD01 with embed(1024, 25) and heads only; SAN01b is CD01b's fine-tuned table with heads only; same trainer.</text><text x="50" y="478" class="">READ: if the SA bars match or beat the CD bars, the FFN was not where the docent's knowledge lived on this corpus.</text><text x="50" y="502" class="m">LIMIT: pooled hashed features have no sequence mixing; the matchers remain the yardstick for usefulness (finding 8).</text></svg>