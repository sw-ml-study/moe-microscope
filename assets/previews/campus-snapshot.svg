<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>Campus snapshot A data structure</title><desc>Nine places from the live campus catalog as flat parallel lists; each place carries a docent block of aliases, concepts, authored queries, and canned stories. The 1442 and its radio demo are excluded on purpose for snapshot B.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">CAMPUS SNAPSHOT A -- places, parents, and docent blocks</text><text x="32" y="60" class="m">WHAT: 9 places as parallel string lists (ids, kinds, parents, titles, taglines, links, aliases, concepts, queries), 21 stories;</text><text x="32" y="78" class="m">content hash 1170810982 over 12868 bytes; a place's URL is derived from its ancestor chain, never stored</text><text x="40" y="104" class="k">place id</text><text x="250" y="104" class="k">kind</text><text x="322" y="104" class="k">title</text><text x="622" y="104" class="k">aliases</text><text x="684" y="104" class="k">concepts</text><text x="750" y="104" class="k">queries</text><text x="806" y="104" class="k">stories</text><text x="862" y="104" class="k">rows</text><text x="40" y="124" class="">campus</text><text x="250" y="124" class="m">campus</text><text x="322" y="124" class="">Software Wrighter Research Campus</text><text x="622" y="124" class="">4</text><text x="684" y="124" class="">3</text><text x="750" y="124" class="">3</text><text x="806" y="124" class="">2</text><text x="862" y="124" class="k">48</text><text x="54" y="144" class="">computer-history</text><text x="250" y="144" class="m">building</text><text x="322" y="144" class="">Computer History Museum</text><text x="622" y="144" class="">4</text><text x="684" y="144" class="">4</text><text x="750" y="144" class="">3</text><text x="806" y="144" class="">2</text><text x="862" y="144" class="k">51</text><text x="68" y="164" class="">ibm-1130</text><text x="250" y="164" class="m">wing</text><text x="322" y="164" class="">IBM 1130 Wing</text><text x="622" y="164" class="">3</text><text x="684" y="164" class="">3</text><text x="750" y="164" class="">2</text><text x="806" y="164" class="">2</text><text x="862" y="164" class="k">38</text><text x="82" y="184" class="">ibm-1130-emulator</text><text x="250" y="184" class="m">exhibit</text><text x="322" y="184" class="">IBM 1130 System Emulator</text><text x="622" y="184" class="">6</text><text x="684" y="184" class="">6</text><text x="750" y="184" class="">6</text><text x="806" y="184" class="">3</text><text x="862" y="184" class="k">78</text><text x="68" y="204" class="">processors</text><text x="250" y="204" class="m">wing</text><text x="322" y="204" class="">Processors and Architectures</text><text x="622" y="204" class="">4</text><text x="684" y="204" class="">3</text><text x="750" y="204" class="">2</text><text x="806" y="204" class="">2</text><text x="862" y="204" class="k">47</text><text x="82" y="224" class="">rca-1802</text><text x="250" y="224" class="m">exhibit</text><text x="322" y="224" class="">RCA COSMAC 1802</text><text x="622" y="224" class="">9</text><text x="684" y="224" class="">7</text><text x="750" y="224" class="">6</text><text x="806" y="224" class="">3</text><text x="862" y="224" class="k">108</text><text x="54" y="244" class="">computer-science</text><text x="250" y="244" class="m">building</text><text x="322" y="244" class="">Computer Science Building</text><text x="622" y="244" class="">3</text><text x="684" y="244" class="">4</text><text x="750" y="244" class="">3</text><text x="806" y="244" class="">2</text><text x="862" y="244" class="k">42</text><text x="68" y="264" class="">language-experiments</text><text x="250" y="264" class="m">wing</text><text x="322" y="264" class="">Language Experiments</text><text x="622" y="264" class="">4</text><text x="684" y="264" class="">3</text><text x="750" y="264" class="">2</text><text x="806" y="264" class="">2</text><text x="862" y="264" class="k">47</text><text x="82" y="284" class="">apl</text><text x="250" y="284" class="m">exhibit</text><text x="322" y="284" class="">APL</text><text x="622" y="284" class="">6</text><text x="684" y="284" class="">6</text><text x="750" y="284" class="">6</text><text x="806" y="284" class="">3</text><text x="862" y="284" class="k">78</text><rect x="30" y="320" width="900" height="200" class="panel"/><text x="50" y="348" class="">WHY: the model must predict meaning (intent, destination) while the catalog stays the authority for titles, URLs,</text><text x="50" y="370" class="">     breadcrumbs, and stories; a stale model can then never invent an exhibit. The docent block is reviewable text.</text><text x="50" y="396" class="">WHY: the language has no lists of records, so a place is an index into parallel lists and sub-lists are pipe-joined.</text><text x="50" y="422" class="">HOW: u:campus_load parses the JSON; u:campus_path walks parents to the root; u:campus_url prefixes the fixture's base;</text><text x="50" y="444" class="">     u:campus_hash is a base-31 rolling checksum over the bytes (no hash builtin), the revision id a manifest will carry.</text><text x="50" y="470" class="m">rca-1802 resolves to https://software-wrighter-lab.github.io/sw-campus/#/campus/computer-history/processors/rca-1802</text><text x="50" y="494" class="m">Source: the live mockup catalog on 2026-09-13, reduced to the three exhibits that exist today and their ancestors.</text></svg>