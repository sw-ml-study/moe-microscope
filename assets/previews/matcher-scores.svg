essors</text><rect x="470" y="177" width="29.99962500468744" height="10" class="tr"/><text x="598" y="186" class="s">2</text><text x="340" y="201" class="s">rca-1802</text><rect x="470" y="192" width="119.99850001874977" height="10" class="tr"/><text x="598" y="201" class="s">8</text><text x="340" y="216" class="s">computer-science</text><rect x="470" y="207" width="0" height="10" class="pad"/><text x="598" y="216" class="s">0</text><text x="340" y="231" class="s">language-experiments</text><rect x="470" y="222" width="0" height="10" class="pad"/><text x="598" y="231" class="s">0</text><text x="340" y="246" class="s">apl</text><rect x="470" y="237" width="0" height="10" class="pad"/><text x="598" y="246" class="s">0</text><text x="340" y="261" class="s">computational-sciences</text><rect x="470" y="252" width="0" height="10" class="pad"/><text x="598" y="261" class="s">0</text><text x="340" y="276" class="s">machine-learning</text><rect x="470" y="267" width="0" height="10" class="pad"/><text x="598" y="276" class="s">0</text><text x="340" y="291" class="s">moe-microscope</text><rect x="470" y="282" width="0" height="10" class="pad"/><text x="598" y="291" class="s">0</text><text x="640" y="90" class="k">paraphrase (no alias):</text><text x="640" y="104" class="k">the machine with the toggle</text><text x="640" y="118" class="k">switches and hex displays</text><text x="640" y="136" class="m">mockup: navigate / computational-sciences</text><text x="640" y="152" class="m">text: navigate / rca-1802</text><text x="640" y="170" class="s">campus</text><rect x="770" y="161" width="0" height="10" class="pad"/><text x="898" y="170" class="s">0</text><text x="640" y="185" class="s">computer-history</text><rect x="770" y="176" width="31.199376012479753" height="10" class="tr"/><text x="898" y="185" class="s">1.3</text><text x="640" y="200" class="s">ibm-1130</text><rect x="770" y="191" width="35.999280014399716" height="10" class="tr"/><text x="898" y="200" class="s">1.5</text><text x="640" y="215" class="s">ibm-1130-emulator</text><rect x="770" y="206" width="47.99904001919962" height="10" class="tr"/><text x="898" y="215" class="s">2</text><text x="640" y="230" class="s">processors</text><rect x="770" y="221" width="0" height="10" class="pad"/><text x="898" y="230" class="s">0</text><text x="640" y="245" class="s">rca-1802</text><rect x="770" y="236" width="119.99760004799904" height="10" class="tr"/><text x="898" y="245" class="s">5</text><text x="640" y="260" class="s">computer-science</text><rect x="770" y="251" width="0" height="10" class="pad"/><text x="898" y="260" class="s">0</text><text x="640" y="275" class="s">language-experiments</text><rect x="770" y="266" width="0" height="10" class="pad"/><text x="898" y="275" class="s">0</text><text x="640" y="290" class="s">apl</text><rect x="770" y="281" width="0" height="10" class="pad"/><text x="898" y="290" class="s">0</text><text x="640" y="305" class="s">computational-sciences</text><rect x="770" y="296" width="107.99784004319915" height="10" class="tr"/><text x="898" y="305" class="s">4.5</text><text x="640" y="320" class="s">machine-learning</text><rect x="770" y="311" width="83.99832003359933" height="10" class="tr"/><text x="898" y="320" class="s">3.5</text><text x="640" y="335" class="s">moe-microscope</text><rect x="770" y="326" width="0" height="10" class="pad"/><text x="898" y="335" class="s">0</text><rect x="30" y="340" width="900" height="180" class="panel"/><text x="50" y="366" class="">WHY: the docent must add value above this, measurably: same catalog, same held-out rows, same metrics, side by side in</text><text x="50" y="388" class="">     docent-results.md. On templated rows the matcher is near perfect because the rows were generated from the aliases.</text><text x="50" y="414" class="">HOW: each query token takes the best exact signal weight for a place, else 0.8 of the best partial (five-plus letters, one</text><text x="50" y="436" class="">     containing the other); +0.5 open, +0.5 exhibit, +4 for an alias phrase; intent by keyword rules; no place means unsupported.</text><text x="50" y="462" class="">HOW: the text variant indexes story and status sentences at weight 1, which is the only way a matcher can reach words like</text><text x="50" y="484" class="">     toggle, hex, jupiter; the mockup's weights still favor an alias hit, so the paraphrase is often lost or misrouted.</text><text x="50" y="508" class="m">Numbers are in the docent results table (MB01, MB01t beside CD01); tests/test_matcher.mlpl pins the rules and the scorer.</text></svg>