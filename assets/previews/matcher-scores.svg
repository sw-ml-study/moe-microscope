<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>Deterministic matcher baseline</title><desc>An alias query and a paraphrase scored by the mockup's alias-and-concept matcher and by the same matcher over all catalog text: per-place scores, the intent rule that fired, and the failure a paraphrase causes.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">MATCHER BASELINE -- what deterministic matching already gets right</text><text x="32" y="60" class="m">WHAT: the mockup's predict() in MLPL (284 weighted signals) and a text variant (1010 signals); per-place scores for two queries.</text><text x="40" y="90" class="k">alias query: where is the cosmac demo</text><text x="40" y="108" class="m">mockup: navigate / rca-1802</text><text x="40" y="126" class="s">campus</text><rect x="170" y="117" width="0" height="10" class="pad"/><text x="298" y="126" class="s">0</text><text x="40" y="141" class="s">computer-history</text><rect x="170" y="132" width="0" height="10" class="pad"/><text x="298" y="141" class="s">0</text><text x="40" y="156" class="s">ibm-1130</text><rect x="170" y="147" width="0" height="10" class="pad"/><text x="298" y="156" class="s">0</text><text x="40" y="171" class="s">ibm-1130-emulator</text><rect x=