<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>Token window data structure</title><desc>The alphabet assigns each character an id. The example text is encoded, right padded with id zero, then split into x (first T ids), y (the same ids shifted by one), and a mask that is one only where y is an answer or stop token.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">TOKEN WINDOW -- text to x, y, mask</text><text x="32" y="60" class="m">WHAT: alphabet of 52 characters; a character index is its token id; index 0 (~) is padding</text><rect x="32" y="74" width="15" height="24" class="cell"/><text x="39" y="91" class="">~</text><rect x="49" y="74" width="15" height="24" class="cell"/><text x="56" y="91" class=""> </text><rect x="66" y="74" width="15" height="24" class="cell"/><text x="73" y="91" class="">0</text><rect x="83" y="74" width="15" height="24" class="cell"/><text x="90" y="91" class="">1</text><rect x="100" y="74" width="15" height="24" class="cell"/><text x="107" y="91" class="">2</text><rect x="117" y="74" width="15" height="24" class="cell"/><text x="124" y="91" class="">3</text><rect x="134" y="74" width="15" height="24" class="cell"/><text x="141" y="91" class="">4</text><rect x="151" y="74" width="15" height="24" class="cell"/><text x="158" y="91" class="">5</text><rect x="168" y="74"