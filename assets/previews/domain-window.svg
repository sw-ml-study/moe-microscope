class="pad"/><text x="445" y="330" class="">0</text><rect x="470" y="313" width="28" height="24" class="pad"/><text x="475" y="330" class="">0</text><rect x="500" y="313" width="28" height="24" class="pad"/><text x="505" y="330" class="">0</text><rect x="530" y="313" width="28" height="24" class="pad"/><text x="535" y="330" class="">0</text><rect x="560" y="313" width="28" height="24" class="pad"/><text x="565" y="330" class="">0</text><rect x="590" y="313" width="28" height="24" class="pad"/><text x="595" y="330" class="">0</text><rect x="30" y="360" width="900" height="160" class="panel"/><text x="50" y="390" class="">WHY: next-token prediction needs an input row and a target row offset by one; padding to T lets N examples stack as [N, T].</text><text x="50" y="415" class="">WHY: the mask limits scoring to the answer and stop tokens, so a model is graded on answering, not on copying the prompt.</text><text x="50" y="445" class="">HOW: u:domain_encode maps characters with str_find; u:domain_window pads with fill, slices x and y with gather_rows,</text><text x="50" y="470" class="">     builds the mask as gt(position, bar) * lt(position, length); u:domain_windows stacks rows with concat on axis 0.</text><text x="50" y="500" class="m">Highlighted y cells are the two masked targets, the answer 5 and the stop token; tests/test_domain.mlpl asserts them.</text></svg>