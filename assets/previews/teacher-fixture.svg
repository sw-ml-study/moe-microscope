<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>TE01 teacher export data structure</title><desc>The teacher fixture stores, for every answer position of every training row, the target id and the top eight next-token ids with their log-probabilities as parallel flat vectors; the diagram shows the first training row's positions with probability bars.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">TE01 TEACHER EXPORT -- soft targets for distillation</text><text x="32" y="60" class="m">WHAT: 406 masked positions x top_k=8; parallel vectors rows, positions, targets, topk_ids, topk_logprobs; 19956 teacher params</text><text x="32" y="96" class="k">training row 0:  the bird ran on the |nest.</text><text x="32" y="118" class="k">position   target   top-8 ids (probability)</text><text x="32" y="146" class="">20          n  (36)</text><rect x="250" y="128" width="62" height="14" class="on"/><text x="250" y="156" class="s">n 1</text><rect x="334" y="128" width="2" height="14" class="t0"/><text x="334" y="156" class="s">l 0</text><rect x="418" y="128" width="2" height="14" class="t0"/><text x="418" y="156" class="s">s 0</text><rect x="502" y="128" width="2" height="14" class="t0"/><text x="502" y="156" class="s">e 0</text><rect x="586" y="128" width="2" height="14" class="t0"/><text x="586" y="156" class