ral; an external teacher exports the same shape.</text><text x="50" y="478" class="">HOW: u:topk_export runs the teacher on every training row, keeps masked positions, argtop_k over log softmax, gathers values.</text><text x="50" y="503" class="m">Pink bars are the target id, blue bars competing ids; width is exp(logprob). Tests pin logprobs and agreement.</text></svg>