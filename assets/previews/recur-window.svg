<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>One window through the recurrences</title><desc>The example window 2+3=|5. after each of four recurrences of the trained R=4 block: the argmax next token at every position beside the target, and the state's first values.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">ONE WINDOW -- the prediction after each recurrence</text><text x="32" y="60" class="m">WHAT: window 2+3=|5., positions 0..6; the graded positions are the answer 5 and the stop token.</text><text x="40" y="92" class="k">input</text><rect x="200" y="76" width="28" height="24" class="cell"/><text x="207" y="93" class="">2</text><rect x="230" y="76" width="28" height="24" class="cell"/><text x="237" y="93" class="">+</text><rect x="260" y="76" width="28" height="24" class="cell"/><text x="267" y="93" class="">3</text><rect x="290" y="76" width="28" height="24" class="cell"/><text x="297" y="93" class="">=</text><rect x="320" y="76" width="28" height="24" class="cell"/><text x="327" y="93" class="">|</text><rect x="350" y="76" width="28" height="24" class="cell"/><text x="357" y="93" class="">5</text><rect x="380" y="76" width="28" height="24" class="cell"/><text x="387" y="93" class="">.</text><text x="40" y="132" class="k">target (next)</text><rect x="200" y="116" width="28" height="24" class="cell"/><text x="205" y="133" class="">12</text><rect x="230" y="116" width="28" height="24" class="cell"/><text x="235" y="133" class="">5</text><rect x="260" y="116" width="28" height="24" class="cell"/><text x="265" y="133" class="">15</text><rect x="290" y="116" width="28" height="24" class="cell"/><text x="295" y="133" class="">50</text><rect x="320" y="116" width="28" height="24" class="on"/><text x="325" y="133" class="">7</text><rect x="350" y="116" width="28" height="24" class="on"/><text x="355" y="133" class="">51</text><rect x="380" y="116" width="28" height="24" class="pad"/><text x="385" y="133" class="">0</text><text x="40" y="172" class="k">after r=1</text><rect x="200" y="156" width="28" height="24" class="cell"/><text x="205" y="173" class="">2</text><rect x="230" y="156" width="28" height="24" class="cell"/><text x="235" y="173" class="">2</text><rect x="260" y="156" width="28" height="24" class="cell"/><text x="265" y="173" class="">8</text><rect x="290" y="156" width="28" height="24" class="cell"/><text x="295" y="173" class="">8</text><rect x="320" y="156" width="28" height="24" class="cell"/><text x="325" y="173" class="">8</text><rect x="350" y="156" width="28" height="24" class="cell"/><text x="355" y="173" class="">8</text><rect x="380" y="156" width="28" height="24" class="cell"/><text x="385" y="173" class="">8</text><text x="40" y="212" class="k">after r=2</text><rect x="200" y="196" width="28" height="24" class="cell"/><text x="205" y="213" class="">2</text><rect x="230" y="196" width="28" height="24" class="cell"/><text x="235" y="213" class="">6</text><rect x="260" y="196" width="28" height="24" class="cell"/><text x="265" y="213" class="">8</text><rect x="290" y="196" width="28" height="24" class="cell"/><text x="295" y="213" class="">8</text><rect x="320" y="196" width="28" height="24" class="cell"/><text x="325" y="213" class="">8</text><rect x="350" y="196" width="28" height="24" class="cell"/><text x="355" y="213" class="">8</text><rect x="380" y="196" width="28" height="24" class="cell"/><text x="385" y="213" class="">8</text><text x="40" y="252" class="k">after r=3</text><rect x="200" y="236" width="28" height="24" class="cell"/><text x="205" y="253" class="">2</text><rect x="230" y="236" width="28" height="24" class="cell"/><text x="235" y="253" class="">6</text><rect x="260" y="236" width="28" height="24" class="cell"/><text x="265" y="253" class="">8</text><rect x="290" y="236" width="28" height="24" class="cell"/><text x="295" y="253" class="">8</text><rect x="320" y="236" width="28" height="24" class="cell"/><text x="325" y="253" class="">8</text><rect x="350" y="236" width="28" height="24" class="cell"/><text x="355" y="253" class="">8</text><rect x="380" y="236" width="28" height="24" class="cell"/><text x="385" y="253" class="">8</text><text x="40" y="292" class="k">after r=4</text><rect x="200" y="276" width="28" height="24" class="cell"/><text x="205" y="293" class="">2</text><rect x="230" y="276" width="28" height="24" class="cell"/><text x="235" y="293" class="">6</text><rect x="260" y="276" width="28" height="24" class="cell"/><text x="265" y="293" class="">8</text><rect x="290" y="276" width="28" height="24" class="cell"/><text x="295" y="293" class="">8</text><rect x="320" y="276" width="28" height="24" class="cell"/><text x="325" y="293" class="">8</text><rect x="350" y="276" width="28" height="24" class="cell"/><text x="355" y="293" class="">8</text><rect x="380" y="276" width="28" height="24" class="cell"/><text x="385" y="293" class="">8</text><text x="460" y="92" class="k">state after each recurrence, position 4 (the bar before the answer), first 8 of 16 values</text><text x="460" y="116" class="">r=1  -1.28  2.45  4.54  19.56  -3.21  0.15  6.66  0.75</text><text x="460" y="138" class="">r=2  6.81  8.28  -6.18  32.28  -11.44  -7.1  5.93  2.5</text><text x="460" y="160" class="">r=3  12.27  10.32  -10.93  51.57  -20.26  -16.85  12.5  -0.14</text><text x="460" y="182" class="">r=4  14.46  11.19  -4.93  70.1  -28.23  -27.3  21.25  -9.73</text><rect x="30" y="330" width="900" height="190" class="panel"/><text x="50" y="358" class="">WHY: a recurrent block is only interesting if the answer improves as the state is refined; highlighted cells are graded</text><text x="50" y="380" class="">     positions where the argmax equals the target after that recurrence.</text><text x="50" y="406" class="">HOW: recur/state/r and recur/argmax/r are emitted for r = 1..4 from the trained R=4 model on this window; the live demo</text><text x="50" y="428" class="">     replays them frame by frame; the values here are the same recorded ones.</text><text x="50" y="456" class="m">Ids are alphabet indices (u:domain_alphabet); id 0 is padding. The state rows are what the next recurrence reads.</text></svg>