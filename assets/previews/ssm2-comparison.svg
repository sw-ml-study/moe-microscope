<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>Four sequence mixers on the same block</title><desc>Validation loss, held-out prose and MLPL exact match, sequence-mixer parameters, and persistent state bytes at a 16-token history for DN01's attention, SS01's fixed decay, and the selective block at matched and wide state, every number read from the results table.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">ATTENTION, FIXED DECAY, SELECTIVE DECAY -- same block, same budget</text><text x="32" y="60" class="m">WHAT: one sequence mixer swapped into the DN01 block; everything else (embedding, FFN, norm, head, data, epochs) is identical.</text><text x="40" y="92" class="k">validation loss (lower is better; axis top 6.19)</text><rect x="60" y="163" width="56" height="69" class="tr"/><text x="60" y="159" class="s">3.7888</text><text x="60" y="248" class="s">DN01</text><rect x="150" y="150" width="56" height="82" class="tr"/><text x="150" y="146" class="s">4.5618</text><text x="150" y="248" class="s">SS01</text><rect x="240" y="152" width="56" height="80" class="tr"/><text x="240" y="148" class="s">4.4231</text><text x="240" y="248" class="s">SS02m</text><rect x="330" y="130" width="56" height="102" class="tr"/><text x="330" y="126" class="s">5.6309</text><text x="330" y="248" class="s">SS02</text><text x="470" y="92" class="k">held-out exact match: prose (violet), MLPL (blue)</text><rect x="490" y="157" width="26" height="76" class="t3"/><rect x="520" y="232" width="26" height="1" class="t0"/><text x="490" y="153" class="s">0.667</text><text x="490" y="248" class="s">DN01</text><rect x="580" y="157" width="26" height="76" class="t3"/><rect x="610" y="200" width="26" height="33" class="t0"/><text x="580" y="153" class="s">0.667</text><text x="580" y="248" class="s">SS01</text><rect x="670" y="157" width="26" height="76" class="t3"/><rect x="700" y="216" width="26" height="17" class="t0"/><text x="670" y="153" class="s">0.667</text><text x="670" y="248" class="s">SS02m</text><rect x="760" y="120" width="26" height="113" class="t3"/><rect x="790" y="200" width="26" height="33" class="t0"/><text x="760" y="116" class="s">1</text><text x="760" y="248" class="s">SS02</text><text x="40" y="290" class="k">mixer                          total params   mixer params   state B (16 tok)   val loss   prose   mlpl</text><text x="40" y="314" class="">DN01 attention</text><text x="300" y="314" class="">3812</text><text x="410" y="314" class="">1024</text><text x="520" y="314" class="">4096</text><text x="650" y="314" class="">3.7888</text><text x="730" y="314" class="">0.667</text><text x="800" y="314" class="">0</text><text x="40" y="336" class="">SS01 fixed decay</text><text x="300" y="336" class="">3844</text><text x="410" y="336" class="">1056</text><text x="520" y="336" class="">256</text><text x="650" y="336" class="">4.5618</text><text x="730" y="336" class="">0.667</text><text x="800" y="336" class="">0.286</text><text x="40" y="358" class="">SS02m selective, matched</text><text x="300" y="358" class="">3828</text><text x="410" y="358" class="">1040</text><text x="520" y="358" class="">128</text><text x="650" y="358" class="">4.4231</text><text x="730" y="358" class="">0.667</text><text x="800" y="358" class="">0.143</text><text x="40" y="380" class="">SS02 selective, wide</text><text x="300" y="380" class="">4868</text><text x="410" y="380" class="">2080</text><text x="520" y="380" class="">256</text><text x="650" y="380" class="">5.6309</text><text x="730" y="380" class="">1</text><text x="800" y="380" class="">0.286</text><rect x="30" y="412" width="900" height="112" class="panel"/><text x="50" y="438" class="">READ: at a matched mixer budget the selective decay beats the fixed one (4.42 against 4.56) with half the state bytes;</text><text x="50" y="460" class="">     widening it to SS01's state doubles the mixer parameters and makes the held-out loss worse, not better.</text><text x="50" y="486" class="">     Attention still wins the loss at this scale, and pays for it with a state that grows with every token of history.</text><text x="50" y="510" class="m">At a 16-token history attention keeps a key and a value row per token; the scan keeps one vector. Decay range 0.23 in the matched window: real but narrow.</text></svg>