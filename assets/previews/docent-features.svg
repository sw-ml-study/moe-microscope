<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>Docent feature hashing data structure</title><desc>One lowercase query is split into words and adjacent bigrams; each is hashed to one of 1024 slots; the slots select rows of the learned embedding table and their mean is the query vector the heads see.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.l3{fill:none;stroke:#3b82f6;stroke-width:2}.l4{fill:none;stroke:#7c3aed;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">FEATURE HASHING -- query to slots to pooled embedding</text><text x="32" y="60" class="m">WHAT: words and bigrams hashed modulo 1024 slots into a padded [24] id row with a mask; the pooled vector is their mean.</text><text x="40" y="92" class="k">query   where is the cosmac demo</text><text x="40" y="116" class="k">feature</text><text x="300" y="116" class="k">slot</text><text x="360" y="116" class="k">embedding row (first 8 of 24 dims, after training)</text><text x="40" y="138" class="">where</text><text x="300" y="138" class="">320</text><text x="360" y="138" class="m">0.49  0.63  -0.9  -0.38  0.28  0.51  -0.16  0.56</text><text x="40" y="158" class="">is</text><text x="300" y="158" class="">881</text><text x="360" y="158" class="m">0.1  0.11  0.21  0.17  0.42  0.11  -0.12  0.51</text><text x="40" y="178" class="">the</text><text x="300" y="178" class="">778</text><text x="360" y="178" class="m">-0.04  0.13  -0.2  -0.06  0.42  0.09  -0.31  0.51</text><text x="40" y="198" class="">cosmac</text><text x="300" y="198" class="">307</text><text x="360" y="198" class="m">-0.28  -0.88  -0.77  -0.3  0.09  0.18  -1.25  0.42</text><text x="40" y="218" class="">demo</text><text x="300" y="218" class="">618</text><text x="360" y="218" class="m">0.3  0.11  -0.64  -0.92  0.07  1.2  -0.28  0.47</text><text x="40" y="238" class="">where_is</text><text x="300" y="238" class="">390</text><text x="360" y="238" class="m">0.57  0.46  -0.66  -0.21  0.23  0.24  -0.17  0.72</text><text x="40" y="258" class="">is_the</text><text x="300" y="258" class="">679</text><text x="360" y="258" class="m">0.03  -0.11  -0.2  0.04  -0.12  -0.07  -0.03  0.43</text><text x="40" y="278" class="">the_cosmac</text><text x="300" y="278" class="">741</text><text x="360" y="278" class="m">0.02  -0.09  0.12  -0.32  -0.11  -0.07  -0.22  0.2</text><text x="40" y="298" class="">cosmac_demo</text><text x="300" y="298" class="">55</text><text x="360" y="298" class="m">0.06  -0.03  -0.14  0.02  -0.04  -0.09  -0.41  0</text><text x="40" y="326" class="k">pooled (mean)</text><text x="360" y="326" class="">0.14  0.04  -0.35  -0.22  0.14  0.23  -0.33  0.42</text><rect x="30" y="336" width="900" height="184" class="panel"/><text x="50" y="362" class="">WHY: hashed features need no tokenizer file, bound the vocabulary, and give an unseen word a slot instead of an error;</text><text x="50" y="384" class="">     bigrams keep word order where it matters (card reader, array programming); collisions are the price, measured below.</text><text x="50" y="410" class="">HOW: u:docent_features splits on spaces, hashes each word and each adjacent pair with the base-31 checksum modulo 1024,</text><text x="50" y="432" class="">     and pads to 24 slots with a mask; u:docent_pooled is matmul(mask, apply(embed, ids)) / n, so the mean is differentiable.</text><text x="50" y="458" class="">Measured: 641 of 1024 slots are used by the 965 corpus rows (collisions share a row of the table).</text><text x="50" y="488" class="m">Lowercase is by construction (the language has no lowercase builtin); the browser page lowercases before hashing.</text></svg>