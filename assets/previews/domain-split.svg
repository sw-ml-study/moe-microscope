<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>Split data structure</title><desc>Eight rows receive seeded uniform keys; grade_up ranks them; the first six ranks form the training set and the remaining two the validation set.</desc><style>text{font-family:ui-monospace,monospace;fill:#dbeafe;font-size:12px}.h{font-size:20px}.k{fill:#fbbf24}.s{font-size:9px}.m{fill:#a5b4fc}.panel{fill:#172033;stroke:#52627a;stroke-width:2}.cell{fill:#0f172a;stroke:#52627a}.pad{fill:#1e293b;stroke:#334155}.on{fill:#db2777}.t0{fill:#2563eb}.t1{fill:#16a34a}.t2{fill:#d97706}.t3{fill:#7c3aed}.tr{fill:#2563eb}.va{fill:#db2777}.l1{fill:none;stroke:#fbbf24;stroke-width:2}.l2{fill:none;stroke:#db2777;stroke-width:2}.axis{stroke:#52627a;stroke-width:1}.heat{fill:#2563eb;stroke:#52627a}.box{fill:#172033;stroke:#a5b4fc;stroke-width:1.5}</style><rect width="960" height="540" fill="#0b1020"/><text x="32" y="36" class="h">SPLIT -- a seeded permutation, not a coin per row</text><text x="32" y="60" class="m">WHAT: keys:[N] uniform in [0,1); order:[N] = grade_up(keys); train = first round(0.75 N) of order; val = the rest</text><text x="32" y="100" class="k">row</text><text x="160" y="100" class="k">key (seed 0)</text><text x="340" y="100" class="k">rank</text><text x="440" y="100" class="k">assignment</text><rect x="32" y="112" width="60" height="24" class="cell"/><text x="52" y="129" class="">0</text><rect x="160" y="112" width="150" height="24" class="cell"/><text x="168" y="129" class="">0.86</text><rect x="340" y="112" width="60" height="24" class="cell"/><text x="360" y="129" class="">7</text><rect x="440" y="112" width="120" height="24" class="va"/><text x="448" y="129" class="">validation</text><rect x="32" y="140" width="60" height="24" class="cell"/><text x="52" y="157" class="">1</text><rect x="160" y="140" width="150" height="24" class="cell"/><text x="168" y="157" class="">0.394</text><rect x="340" y="140" width="60" height="24" class="cell"/><text x="360" y="157" class="">2</text><rect x="440" y="140" width="120" height="24" class="tr"/><text x="448" y="157" class="">train</text><rect x="32" y="168" width="60" height="24" class="cell"/><text x="52" y="185" class="">2</text><rect x="160" y="168" width="150" height="24" class="cell"/><text x="168" y="185" class="">0.481</text><rect x="340" y="168" width="60" height="24" class="cell"/><text x="360" y="185" class="">3</text><rect x="440" y="168" width="120" height="24" class="tr"/><text x="448" y="185" class="">train</text><rect x="32" y="196" width="60" height="24" class="cell"/><text x="52" y="213" class="">3</text><rect x="160" y="196" width="150" height="24" class="cell"/><text x="168" y="213" class="">0.189</text><rect x="340" y="196" width="60" height="24" class="cell"/><text x="360" y="213" class="">1</text><rect x="440" y="196" width="120" height="24" class="tr"/><text x="448" y="213" class="">train</text><rect x="32" y="224" width="60" height="24" class="cell"/><text x="52" y="241" class="">4</text><rect x="160" y="224" width="150" height="24" class="cell"/><text x="168" y="241" class="">0.175</text><rect x="340" y="224" width="60" height="24" class="cell"/><text x="360" y="241" class="">0</text><rect x="440" y="224" width="120" height="24" class="tr"/><text x="448" y="241" class="">train</text><rect x="32" y="252" width="60" height="24" class="cell"/><text x="52" y="269" class="">5</text><rect x="160" y="252" width="150" height="24" class="cell"/><text x="168" y="269" class="">0.59</text><rect x="340" y="252" width="60" height="24" class="cell"/><text x="360" y="269" class="">4</text><rect x="440" y="252" width="120" height="24" class="tr"/><text x="448" y="269" class="">train</text><rect x="32" y="280" width="60" height="24" class="cell"/><text x="52" y="297" class="">6</text><rect x="160" y="280" width="150" height="24" class="cell"/><text x="168" y="297" class="">0.605</text><rect x="340" y="280" width="60" height="24" class="cell"/><text x="360" y="297" class="">5</text><rect x="440" y="280" width="120" height="24" class="tr"/><text x="448" y="297" class="">train</text><rect x="32" y="308" width="60" height="24" class="cell"/><text x="52" y="325" class="">7</text><rect x="160" y="308" width="150" height="24" class="cell"/><text x="168" y="325" class="">0.85</text><rect x="340" y="308" width="60" height="24" class="cell"/><text x="360" y="325" class="">6</text><rect x="440" y="308" width="120" height="24" class="va"/><text x="448" y="325" class="">validation</text><text x="600" y="129" class="k">order = grade_up(keys)</text><rect x="600" y="140" width="28" height="24" class="cell"/><text x="605" y="157" class="">4</text><rect x="630" y="140" width="28" height="24" class="cell"/><text x="635" y="157" class="">3</text><rect x="660" y="140" width="28" height="24" class="cell"/><text x="665" y="157" class="">1</text><rect x="690" y="140" width="28" height="24" class="cell"/><text x="695" y="157" class="">2</text><rect x="720" y="140" width="28" height="24" class="cell"/><text x="725" y="157" class="">5</text><rect x="750" y="140" width="28" height="24" class="cell"/><text x="755" y="157" class="">6</text><rect x="780" y="140" width="28" height="24" class="cell"/><text x="785" y="157" class="">7</text><rect x="810" y="140" width="28" height="24" class="pad"/><text x="815" y="157" class="">0</text><text x="600" y="200" class="k">train = order[0..6)</text><rect x="600" y="211" width="28" height="24" class="on"/><text x="605" y="228" class="">4</text><rect x="630" y="211" width="28" height="24" class="on"/><text x="635" y="228" class="">3</text><rect x="660" y="211" width="28" height="24" class="on"/><text x="665" y="228" class="">1</text><rect x="690" y="211" width="28" height="24" class="on"/><text x="695" y="228" class="">2</text><rect x="720" y="211" width="28" height="24" class="on"/><text x="725" y="228" class="">5</text><rect x="750" y="211" width="28" height="24" class="on"/><text x="755" y="228" class="">6</text><text x="600" y="270" class="k">val = order[6..8)</text><rect x="600" y="281" width="28" height="24" class="cell"/><text x="605" y="298" class="">7</text><rect x="630" y="281" width="28" height="24" class="pad"/><text x="635" y="298" class="">0</text><rect x="30" y="360" width="900" height="160" class="panel"/><text x="50" y="390" class="">WHY: exact-match accuracy only means something on rows never trained on, and the split must be identical across lessons.</text><text x="50" y="415" class="">WHY: ranking keys gives an exact train count; flipping a coin per row would not.</text><text x="50" y="445" class="">HOW: u:domain_split draws random(seed, [N]), ranks with grade_up, and slices the order with u:domain_slice (gather_rows).</text><text x="50" y="470" class="">     keys, order, train, and val are emitted as data/split observations so a host shows them without knowing what a split is.</text><text x="50" y="500" class="m">The highlighted train strip holds the held-in row indices; tests/test_domain.mlpl asserts every row lands exactly once.</text></svg>