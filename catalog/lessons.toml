[[lesson]]
id = "CD00"
slug = "campus-snapshot-a"
title = "The campus catalog becomes a docent corpus with canned stories"
source = "demos/campus_corpus.mlpl"
library = ["lib/campus.mlpl", "lib/domain.mlpl"]
test = ["tests/test_campus.mlpl"]
previews = ["assets/previews/campus-snapshot.svg", "assets/previews/campus-corpus.svg", "assets/previews/campus-split.svg", "assets/previews/campus-stories.svg"]
fixture = "fixtures/campus/snapshot-a.json"
implementation = "from-scratch"
observations = ["campus/intent-counts", "campus/dest-counts", "campus/split/member", "campus/visit/told"]
