speed = "corpus generation and split run in about 0.1 s in the interpreter; the content hash walks every byte once"
quality = "labels by construction: 6 intents, 12 places plus none; 9 authored ambiguous rows carry an expected top-2 set; the story policy is asserted on a scripted visit"
status = "accepted"

[[lesson]]
id = "CD01"
