speed = "27,000 one-example Adam steps, dense-masked; about 36 seconds; two expert evaluations per token at inference"
quality = "validation masked loss 3.92 (MX01 3.76); validation accuracy mlpl 0.286, prose 0; training exact match 0.86; specialization score 0.42 for top-2 against 0.61 for MX01's top-1 (0.25 is family-blind)"
status = "accepted"

[[lesson]]
id = "DS01"
slug = "data-scale"
title = "Data moves the held-out columns; epochs do not"
source = "demos/scale_train.mlpl"
diagram_source = "demos/scale_microscope.mlpl"
library = ["lib/scale.mlpl", "lib/dense.mlpl", "lib/moe.mlpl", "lib/domain.mlpl", "lib/results.mlpl", "lib/svg.mlpl"]
test = ["tests/test_scale.mlpl"]
previews = ["assets/previews/scale-sweep.svg"]
fixture = "fixtures/scale/index-v1.json"
implementation = "from-scratch"
observations = []
memory = "DN01 (3,812 params) and MX01 (7,096 params) unchanged; data sizes 120, 480, 960 examples"
speed = "opt-in sweep of eight points (minutes); the gate only validates the committed points and redraws the diagram"
quality = "validation loss and per-family held-out accuracy against data size; the 400-epoch points at 120 examples isolate the epoch effect"
status = "accepted"

[[lesson]]
id = "LD01"
slug = "low-rank-delta-experts"
title = "Sixteen experts for the price of two"
source = "demos/delta_experts.mlpl"
library = ["lib/moe.mlpl", "lib/dense.mlpl", "lib/domain.mlpl", "lib/evaluate.mlpl", "lib/results.mlpl", "lib/svg.mlpl"]
test = ["tests/test_moe.mlpl", "tests/test_results.mlpl"]
previews = ["assets/previews/delta-structure.svg", "assets/previews/delta-comparison.svg"]
fixture = "fixtures/moe/mx01-family-by-expert.json"
implementation = "from-scratch"
observations = ["ld/config", "ld/loss/train", "ld/loss/val", "ld/load", "ld/entropy", "ld/balance", "ld/family-by-expert", "ld/specialization", "ld/accuracy/train", "ld/accuracy/val", "ldr/loss/val", "ldr/accuracy/val"]
memory = "shared FFN plus 16 rank-4 delta experts packed as A_all [16, 64] and B_all [64, 16]: 128 parameters (1,024 bytes) per expert against 1,072 (8,576 bytes) for a full expert"
speed = "two extra matmuls per window whatever E is; router cost 272 multiply-adds per token for E = 16; both variants train in under a minute"
quality = "shared plus deltas and deltas-only compared with DN01 (shared only) and MX01 (four full experts) on validation loss and per-family accuracy; family-by-expert map over 16 experts"
status = "accepted"

[[lesson]]
id = "RB01"
slug = "resource-budget"
title = "How big is MicroMoE? Stored, resident, active, transferred"
source = "demos/resource_budget.mlpl"
library = ["lib/budget.mlpl", "lib/results.mlpl", "lib/svg.mlpl"]
test = ["tests/test_budget.mlpl"]
previews = ["assets/previews/budget-storage.svg"]
document = "docs/results/resource-economics.md"
implementation = "from-scratch"
observations = []
memory = "no training; the calculator reproduces every measured parameter count (DN01 3,812; MX01 7,096 with 1,072 per expert; LD01 6,132 with 128 per delta) and projects FP64 to INT4 sizes and residency scenarios"
speed = "milliseconds; transfer estimates (E) for HDD, SATA SSD, NVMe, and RAM by latency plus size over bandwidth"
quality = "every number labeled M, D, or E; mismatches between calculator and results table fail the lesson"
status = "accepted"

[[lesson]]
id = "GB01"
slug = "generation-benchmark"
title = "Measured time to first token, throughput, and tail latency"
