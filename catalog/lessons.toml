schema = "sw-ml-study.moe-microscope-lessons"
version = 1

# implementation: "builtin" (calls shipped sw-MLPL features), "from-scratch" (the mechanism is the lesson), or "both" (detailed and pragmatic forms with a parity check).

[[lesson]]
id = "DM01"
slug = "synthetic-domain"
title = "Text becomes windows, tags, and a held-out split"
source = "demos/domain_microscope.mlpl"
library = ["lib/domain.mlpl", "lib/evaluate.mlpl", "lib/results.mlpl"]
test = ["tests/test_domain.mlpl", "tests/test_evaluate.mlpl", "tests/test_results.mlpl"]
previews = ["assets/previews/domain-window.svg", "assets/previews/domain-tags.svg", "assets/previews/domain-split.svg"]
fixture = "fixtures/domain/mixture-v0.json"
implementation = "builtin"
observations = ["data/tags", "data/window/x", "data/window/y", "data/window/mask", "data/split/keys", "data/split/order"]
memory = "120 examples, window 28: x, y, mask are three [120,28] arrays (10,080 values); alphabet 52 ids"
speed = "generation and windowing are O(N T) with O(N^2) concat copying; sample of 8 runs in well under a second"
quality = "oracle answers by construction; exact-match harness reports arithmetic, sequence, mlpl, prose, overall"
status = "accepted"

[[lesson]]
id = "DN01"
slug = "dense-baseline"
title = "A dense block memorizes; only local patterns generalize"
source = "demos/dense_baseline.mlpl"
library = ["lib/dense.mlpl", "lib/domain.mlpl", "lib/evaluate.mlpl", "lib/results.mlpl", "lib/svg.mlpl"]
test = ["tests/test_dense.mlpl"]
previews = ["assets/previews/dense-model.svg", "assets/previews/dense-run.svg"]
recording = "fixtures/recordings/dense-baseline-run-v0.json"
fixture = "fixtures/domain/mixture-v0.json"
implementation = "builtin"
observations = ["dense/config", "dense/loss/train", "dense/loss/val", "dense/accuracy/train", "dense/accuracy/val", "dense/logits/example-argmax", "dense/attention/example"]
memory = "3,812 parameters (embedding 832, attention 1,024, FFN 1,072, norm and head 884); 2,996 active per token; 23,968 bytes per token at f64"
speed = "27,000 per-example Adam steps; about 0.56 ms per step and 0.02 ms per token on an M1 Max with mlpl-repl 0.22.0; the whole lesson runs in about 16 seconds"
quality = "validation masked loss 3.79 (perplexity 44.2); validation exact match arithmetic 0, sequence 0, mlpl 0, prose 0.667; training exact match 0.70"
status = "accepted"

[[lesson]]
id = "TE01"
slug = "in-repo-teacher"
title = "A larger dense teacher exports soft targets"
source = "demos/teacher.mlpl"
library = ["lib/dense.mlpl", "lib/domain.mlpl", "lib/evaluate.mlpl", "lib/results.mlpl", "lib/svg.mlpl"]
test = ["tests/test_teacher.mlpl", "tests/test_dense.mlpl"]
previews = ["assets/previews/teacher-fixture.svg"]
fixture = "fixtures/teacher/teacher-v0.json"
implementation = "builtin"
observations = ["teacher/config", "teacher/loss/train", "teacher/loss/val", "teacher/accuracy/train", "teacher/accuracy/val", "teacher/export/agreement"]
memory = "19,956 parameters (two 32-wide blocks, 64-wide FFNs); 18,324 active per token; export 406 positions x top-8, about 75 KB"
speed = "27,000 per-example Adam steps, about 2.5 ms per step; trained once by `just teacher write` (about a minute), never in the gate"
quality = "training masked loss 0.135, top-1 agreement with targets 0.963, training exact match 0.83; validation loss 4.14 (memorization, as DN01)"
status = "accepted"

[[lesson]]
id = "MX01"
slug = "moe-top1"
title = "Four experts learn to share the tokens"
source = "demos/moe_baseline.mlpl"
library = ["lib/moe.mlpl", "lib/dense.mlpl", "lib/domain.mlpl", "lib/evaluate.mlpl", "lib/results.mlpl", "lib/svg.mlpl"]
test = ["tests/test_moe.mlpl", "tests/test_dense.mlpl"]
previews = ["assets/previews/router-routing.svg", "assets/previews/moe-run.svg", "assets/previews/moe-balance.svg"]
routing_demo = "demos/router_microscope.mlpl"
fixture = "fixtures/domain/mixture-v0.json"
implementation = "from-scratch"
observations = ["moe/config", "moe/loss/train", "moe/loss/val", "moe/load", "moe/entropy", "moe/balance", "moe/family-by-expert", "moe/accuracy/train", "moe/accuracy/val", "moe/route/example"]
memory = "7,096 parameters (router 68, four experts of 1,072, attention 1,024, embedding 832, head 884); 3,064 active per token with one expert; 24,512 bytes per token at f64"
speed = "27,000 one-example Adam steps with every expert evaluated (dense-masked); about 1.1 ms per step; the lesson runs in about 36 seconds; sparse dispatch is the next lesson"
quality = "validation masked loss 3.76 (DN01 3.79) with 0.667 prose accuracy; training exact match 0.62; final load 208/30/47/121, entropy 0.62 nats, balance 1.17"
status = "accepted"

[[lesson]]
id = "SD01"
slug = "sparse-dispatch"
title = "Run each expert once on its own tokens"
source = "demos/dispatch_microscope.mlpl"
library = ["lib/moe.mlpl", "lib/dense.mlpl", "lib/domain.mlpl", "lib/results.mlpl", "lib/svg.mlpl"]
test = ["tests/test_moe.mlpl"]
previews = ["assets/previews/dispatch-combine.svg"]
fixture = "fixtures/domain/mixture-v0.json"
implementation = "from-scratch"
observations = ["moe/dispatch/parity-max-abs-diff", "moe/dispatch/expert-row-evals", "moe/dispatch/rows-per-expert", "moe/dispatch/params-per-token", "moe/dispatch/ms-per-window", "moe/dispatch/table", "moe/dispatch/example-rows"]
memory = "same MX01 model; sparse dispatch touches the shared 3,064 minus one expert plus one expert's 1,072 parameters per token; each expert is 8,576 bytes at f64"
speed = "row evaluations over 120 windows: 13,440 dense-masked versus 3,360 sparse (exact counts); interpreter ms per window recorded as the machine-dependent secondary metric"
quality = "max absolute output difference between the two paths below 1e-9 on every window: the same model"
status = "accepted"

[[lesson]]
id = "MX02"
slug = "moe-top2-specialization"
title = "Top-2 routing and the specialization map"
source = "demos/moe_top2.mlpl"
library = ["lib/moe.mlpl", "lib/dense.mlpl", "lib/domain.mlpl", "lib/evaluate.mlpl", "lib/results.mlpl", "lib/svg.mlpl"]
test = ["tests/test_moe.mlpl"]
previews = ["assets/previews/moe2-specialization.svg", "assets/previews/moe2-cost.svg"]
fixture = "fixtures/moe/mx01-family-by-expert.json"
implementation = "from-scratch"
observations = ["moe2/config", "moe2/loss/train", "moe2/loss/val", "moe2/load", "moe2/entropy", "moe2/balance", "moe2/family-by-expert", "moe2/specialization", "moe2/accuracy/train", "moe2/accuracy/val", "moe2/route/example"]
memory = "same 7,096-parameter model as MX01; 4,136 active per token with two experts; 33,088 bytes per token at f64"
speed = "27,000 one-example Adam steps, dense-masked; about 36 seconds; two expert evaluations per token at inference"
quality = "validation masked loss 3.92 (MX01 3.76); validation accuracy mlpl 0.286, prose 0; training exact match 0.86; specialization score 0.42 for top-2 against 0.61 for MX01's top-1 (0.25 is family-blind)"
status = "accepted"

[[lesson]]
id = "DS01"
slug = "data-scale"
title = "Data moves the held-out columns; epochs do not"
source = "demos/scale_train.mlpl"
diagram_source = "demos/scale_microscope.mlpl"
library = ["lib/scale.mlpl", "lib/dense.mlpl", "lib/moe.mlpl", "lib/domain.mlpl", "lib/results.mlpl", "lib/svg.mlpl"]
test = ["tests/test_scale.mlpl"]
previews = ["assets/previews/scale-sweep.svg"]
fixture = "fixtures/scale/index-v1.json"
implementation = "from-scratch"
observations = []
memory = "DN01 (3,812 params) and MX01 (7,096 params) unchanged; data sizes 120, 480, 960 examples"
speed = "opt-in sweep of eight points (minutes); the gate only validates the committed points and redraws the diagram"
quality = "validation loss and per-family held-out accuracy against data size; the 400-epoch points at 120 examples isolate the epoch effect"
status = "accepted"
